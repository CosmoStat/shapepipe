# ASTRA record of ShapePipe's scientific decisions: the choices embedded in
# the code and the committed workflow configs (workflow/config/cfis/), why
# they stand, and the alternatives. CLAUDE.md says when to amend it; the
# tests/unit/test_astra_{anchors,values}.py check locations and values separately.
#
# Conventions:
#   * Every rationale ends with one sentence "Anchor: <ref>; <ref>." Each ref
#     is a path relative to the repo root: CODE `path::Symbol` (a def, class
#     or assignment target, dotted for nesting), CONFIG `path#SECTION.KEY`
#     (`path#KEY` for sectionless .sex/.psfex/.param files; .setools uses
#     SECTION.KEY), or FILE `path`. No line numbers. Commented-out keys may
#     resolve as locations, but only active settings can assert values.
#   * Value assertions: `Anchor: path#SECTION.KEY = 1.5; path::NAME = 51.`
#     A ref without ` = value` is location-only. Attaching the expectation to
#     its locator avoids guessing which file a prose number describes, while
#     keeping ordinary, schema-valid prose; no extra ASTRA keys or second
#     parameter table. The anchor is the canonical recorded expectation;
#     rationale/labels may repeat it for readability. Option ids are stable
#     references, never parsed for values. Code/config remains execution truth.
#   * Values are numbers, boolean words, strings (quote expressions), or flat
#     comma lists, optionally bracketed. Semicolons are reserved for refs.
#     Decimal equality is exact (1 = 1.0, 5e-4 = 0.0005), without rounding;
#     Y/yes/true/on and N/no/false/off are case-insensitive boolean aliases,
#     distinct from 1/0. Trim outer whitespace; other strings are case-sensitive.
#     Lists preserve order and length. Only .param VIGNET and .psfex PSF_SIZE
#     accept square-size shorthand: 51 = 51,51 (never 51,53).
#   * SETools predicates retain their operators as quoted text; repeated cuts
#     on one key are an ordered list, e.g. MAG_AUTO = ["> 18.", "< 22."].
#     Expressions compare as text, not algebra. Python selectors may append
#     `[key.subkey]` to a named assignment (identifier-like string dict keys);
#     only the selected literal is read, including dict(key=value) syntax.
#     Ambiguous bindings/settings fail; no imports, calls, arithmetic, argument
#     defaults, environment expansion or implicit tool defaults are evaluated.
#     These limits keep the check static rather than a second pipeline runtime.
#   * A decision's `default` is the option the committed code and configs
#     select; universes/committed.yaml pins it.
#   * `excluded: true` means considered and rejected. An option the code does
#     not implement says so in its description and is not excluded.
#   * [HARDCODED] in a rationale marks a committed choice fixed in code with
#     no config key to change it.
#   * [LINT] in a rationale marks a place where the code disagrees with itself
#     or with its own documentation.
#   * A prior insight repeated inside a sub-analysis carries a `_local`
#     suffix, because insight ids are scoped.

version: "0.0.14"
name: ShapePipe scientific decisions
description: >-
  Codebase-level decision record for the ShapePipe weak-lensing pipeline
  (UNIONS/CFIS) as orchestrated by workflow/Snakefile. Membership test: a
  different defensible choice would change which objects enter the shear
  catalogue, or the numbers attached to them.
tags: [shapepipe, weak-lensing, unions, codebase-record]
container: ghcr.io/cosmostat/shapepipe:develop

inputs:
  - id: tile_images
    type: data
    source: CFIS/UNIONS r-band MegaPipe tile stacks and single-exposure image/weight/flag triplets (workflow/config.yaml)
    description: >-
      Tiles and the exposures that built them; each exposure carries its
      instrument flag image.
  - id: healsparse_masks
    type: data
    source: UNIONS healsparse mask products (e.g. mask_ugriz_nside131072_n4.hsp)
    description: >-
      Sky-fixed mask maps, built outside ShapePipe and queried at object
      positions; how they are used is the masking sub-analysis.

outputs:
  - id: final_cat
    type: data
    format: fits
    description: >-
      Per-tile shear catalogue family, the terminal science product
      (make_cat_runner).
    inputs: [tile_images, healsparse_masks]
    decisions: [per_unit_completeness, postage_stamp_size, photometric_zeropoint]

decisions:

  # ── cross-cutting ────────────────────────────────────────────────────────

  per_unit_completeness:
    label: Per-unit completeness gate
    rationale: >-
      Every rule that runs shapepipe_run checks its products against a
      nominal per-runner count (tile_ngmix per chunk): a runner below
      its count fails the unit (an exposure or a tile), so a partial
      unit never enters the catalogue; the missing unit's objects do not
      appear at all. The one tolerated shortfall is the exposure-side
      psfex_interp VALIDATION output, where a CCD whose model fails the
      acceptance gate (star_selection_psf.psf_acceptance_thresholds)
      produces nothing and the unit only warns; the MCCD chain, never
      run in a campaign, warns on every runner. Science-path PSF
      rejection does not go through this table: psfex_interp drops the
      epoch per object inside the tile run. [LINT] the completeness.py
      docstring gives tile psfex_interp as its warn example, but that
      runner is mandatory, and a workflow/rules/exposure.smk comment
      says a floor's :warn tolerates setools rejecting a sparse CCD, but
      setools has a mandatory count and no floor exists.
      Anchor: workflow/scripts/completeness.py::COMPLETENESS.
    default: exact_counts
    options:
      exact_counts:
        label: Nominal count per runner; psfex_interp validation shortfall warns
        insights: [des_psf_blacklist, guinot22_star_floor_22]
      count_floor:
        label: Tolerate recorded attrition down to a per-runner floor
        excluded: true
        excluded_reason: >-
          The floors had no basis: across a 127-exposure, 64-tile campaign
          every non-warning runner produced exactly its nominal count, so a
          floor below it only admits failed units unremarked.
      no_gate:
        label: Accept whatever is produced
        excluded: true
        excluded_reason: >-
          A stage producing 2 of 40 CCDs would flow into the catalogue
          unremarked.

  postage_stamp_size:
    label: Postage-stamp size shared by vignets, ngmix stamps and PSF models
    rationale: >-
      One number, 51 px (about 9.5 arcsec), pins three coupled apertures:
      the SExtractor VIGNET(51,51) around each detection, the vignetmaker
      stamps that feed ngmix (STAMP_SIZE in both vignetmaker runs), and the
      PSFEx model stamp (PSF_SIZE 51,51). The stamp is the pixel data ngmix
      fits: it bounds the measurable galaxy size and truncates the wings of
      large galaxies. No rationale for 51 is recorded.
      Anchor: workflow/config/cfis/default_noimaflags.param#VIGNET = 51;
      workflow/config/cfis/default.param#VIGNET = 51;
      workflow/config/cfis/config_tile_PiViVi_psfex.ini#VIGNETMAKER_RUNNER_RUN_1.STAMP_SIZE = 51;
      workflow/config/cfis/config_tile_PiViVi_psfex.ini#VIGNETMAKER_RUNNER_RUN_2.STAMP_SIZE = 51;
      workflow/config/cfis/default.psfex#PSF_SIZE = 51.
    default: px_51
    options:
      px_51:
        label: 51x51 px everywhere
      larger_adaptive:
        label: Larger or size-adaptive stamps
        description: >-
          Not implemented; needs the vignet, stamp and PSF sizes changed
          together, since changing one alone desynchronises them.

  photometric_zeropoint:
    label: Magnitude zero-point convention
    rationale: >-
      Tiles use a fixed MAG_ZEROPOINT 30.0 (ZP_FROM_HEADER=False), and
      ngmix repeats it in MAG_ZP; exposures read the per-image header
      PHOTZP. The fixed tile value assumes the MegaPipe stacks are
      calibrated to 30; nothing in the repo checks it. Magnitude cuts
      (the star-selection window, downstream galaxy cuts) inherit
      whichever convention their stage uses.
      Anchor: workflow/config/cfis/default_tile.sex#MAG_ZEROPOINT = 30.0;
      workflow/config/cfis/config_tile_Sx.ini#SEXTRACTOR_RUNNER.ZP_FROM_HEADER = False;
      workflow/config/cfis/config_tile_Ng_template.ini#NGMIX_RUNNER.MAG_ZP = 30.0;
      workflow/config/cfis/config_exp_psfex.ini#SEXTRACTOR_RUNNER.ZP_FROM_HEADER = True;
      workflow/config/cfis/config_exp_psfex.ini#SEXTRACTOR_RUNNER.ZP_KEY = PHOTZP;
      src/shapepipe/modules/sextractor_package/sextractor_script.py::SExtractorCaller.get_zero_point.
    default: fixed_30_tiles_header_exposures
    options:
      fixed_30_tiles_header_exposures:
        label: Tiles fixed 30.0; exposures from header PHOTZP
      header_everywhere:
        label: Per-image header zero-points on tiles too
        description: >-
          ZP_FROM_HEADER=True on tiles; changes magnitudes only where a tile's
          header zero-point differs from 30.

prior_insights:
  des_psf_blacklist:
    claim: >-
      DES enters a CCD's PSF model into a blacklist rather than failing the
      exposure - in Y3, any CCD with fewer than 25 stars surviving outlier
      rejection is blacklisted and excluded downstream (~2% of data removed),
      and processing proceeds.
    created_at: "2026-07-16T00:00:00Z"
    evidence:
      - id: ev_jarvis_y3
        doi: "10.48550/arXiv.2011.03409"
        quote:
          exact: "we enter it into a"
          suffix: " “blacklist” and exclude this CCD"
        location: { page: 10 }
  guinot22_star_floor_22:
    claim: >-
      The published ShapePipe/UNIONS analysis applies a per-CCD quality floor
      rather than failing whole exposures: a CCD with fewer than 22 selected
      stars is discarded for PSF estimation and contributes no epoch to the
      shape measurement, while processing continues.
    created_at: "2022-04-01T00:00:00Z"
    evidence:
      - id: ev_guinot22_star_floor
        doi: "10.48550/arXiv.2204.04798"
        quote:
          exact: 'The dashed line represents the cut at 22 stars/CCD below which the CCD is discarded for the PSF estimation.'
        location: { page: 4 }

analyses:

  # ═════════════════════════════════════════════════════════════════════════
  masking:
    description: >-
      Which masks reach the measurement, and where. ShapePipe generates no
      masks. The instrument flag image delivered with each exposure is the
      only mask that reaches pixels. Sky-fixed masks (star halos and bodies,
      manual regions, missing bands) are healsparse maps built outside
      ShapePipe; their geometry is decided there. Inside ShapePipe they are
      only queried at object positions into catalogue columns, and no stage
      cuts on those columns.
    inputs:
      - id: exposure_flags
        type: data
        source: per-CCD instrument flag images split from each exposure (exp_split family)
      - id: sky_masks
        type: data
        source: UNIONS healsparse mask maps
    outputs:
      - id: masked_measurement_inputs
        type: data
        format: fits
        description: >-
          Exposure detection catalogues carrying IMAFLAGS_ISO (and MASK_EXT when
          maps are configured), the flag stamps ngmix reads, and the final
          catalogue's optional MASK_<band> columns.
        inputs: [exposure_flags, sky_masks]
        decisions: [pixel_mask_source, psf_star_mask_veto, sky_mask_application]
    decisions:
      pixel_mask_source:
        label: Only the instrument flag image reaches pixels
        rationale: >-
          On exposures SExtractor reads the split flag image (FLAG_IMAGE=True),
          producing IMAFLAGS_ISO, which the PSF star selection requires to be
          zero. The multi-epoch vignet run cuts flag stamps from the same split
          flag image, and ngmix gives weight 0 to every flagged pixel and drops
          epochs that are mostly flagged (shape_measurement.defect_fill,
          shape_measurement.epoch_masked_fraction_cut). Tiles have no flag
          image, so tile detection runs unflagged
          (detection.detection_source_mode). Sky-fixed masks never touch
          pixels: an object inside a star halo is measured from the same
          pixels as one outside it.
          Anchor: workflow/config/cfis/config_exp_psfex.ini#SEXTRACTOR_RUNNER.FLAG_IMAGE = True;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#VIGNETMAKER_RUNNER_RUN_2.ME_IMAGE_PATTERN = flag, image, weight, background, background_rms;
          src/shapepipe/modules/ngmix_package/ngmix.py::prepare_ngmix_weights.
        default: instrument_flags_only
        options:
          instrument_flags_only:
            label: Instrument flags gate pixels; sky masks stay at catalogue level
          rasterised_sky_masks:
            label: Rasterise healsparse masks into the pixel flags
            insights: [farrens22_pipeline_masks]
            excluded: true
            excluded_reason: >-
              Sky-fixed masks say where an object sits, not that its pixels are
              corrupted, so what to do about them is an analysis decision.
              Rasterising them would bake one mask version into every shape;
              catalogue columns leave the choice downstream.
      psf_star_mask_veto:
        label: PSF-star candidates rejected on instrument flags only
        rationale: >-
          The star selection cuts IMAFLAGS_ISO == 0 and nothing else
          from the masks. mask_query sits in the exposure module
          chain between SExtractor and setools: when MASK_PATHS
          names maps it writes MASK_EXT (0 clean, nonzero flagged;
          off-coverage counts as clean) onto each CCD's catalogue.
          MASK_PATHS ships commented out, so the committed module
          passes the catalogue through with no MASK_EXT column. The
          intended map is the UNIONS star-body product (bit 2); halo
          bits 0 and 1 are excluded because halos say nothing about
          whether a star is a good PSF sample. Imposing the veto is
          one line per mask block in star_selection.setools
          (MASK_EXT == 0). [LINT] the workflow/rules/exposure.smk
          docstring names the column FLAG_EXT and says setools cuts
          on it; the code writes MASK_EXT and nothing cuts on it.
          Anchor: workflow/config/cfis/config_exp_psfex.ini;
          workflow/config/cfis/star_selection.setools#MASK:star_selection.IMAFLAGS_ISO = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:preselect.IMAFLAGS_ISO = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:flag.IMAFLAGS_ISO = "== 0";
          src/shapepipe/modules/mask_query_runner.py::mask_query_runner;
          src/shapepipe/utilities/mask_query.py::flag_positions.
        default: instrument_flags_only
        options:
          instrument_flags_only:
            label: IMAFLAGS_ISO == 0; no sky map queried
          star_body_veto:
            label: Also reject candidates on the star-body map (MASK_EXT == 0)
            description: >-
              Set MASK_PATHS to the star-body map and add MASK_EXT == 0 beside
              each IMAFLAGS_ISO cut. Querying without the cut records MASK_EXT
              and changes no star.
          star_body_and_halo_veto:
            label: Also reject candidates inside star halos
            excluded: true
            excluded_reason: >-
              Halos flag objects for the final catalogue; a star inside another
              star's halo is not thereby a bad PSF sample.
      sky_mask_application:
        label: Object-level sky masking deferred downstream
        rationale: >-
          The final catalogue ships every detected object. When MASK_EXT_PATHS
          lists band:path pairs, make_cat queries each healsparse map at the
          object's windowed position and writes one MASK_<band> column holding
          the map value verbatim; an object off a map's coverage gets that
          map's sentinel (False for boolean maps, which reads as unmasked;
          typically -1 for integer maps). The committed make_cat config sets no
          MASK_EXT_PATHS, so no mask column is written and every mask cut
          happens downstream against the maps themselves.
          Anchor: src/shapepipe/modules/make_cat_runner.py::make_cat_runner;
          src/shapepipe/modules/make_cat_package/make_cat.py::save_mask_ext_data;
          src/shapepipe/utilities/mask_query.py::query_map.
        default: deferred_downstream
        options:
          deferred_downstream:
            label: No mask columns; all objects shipped
          catalogue_columns:
            label: Per-band MASK_<band> columns from MASK_EXT_PATHS, no cut
          pipeline_cut:
            label: Drop masked objects inside the pipeline
            excluded: true
            excluded_reason: >-
              Location flags are analysis decisions; a pipeline cut would fix
              one mask version into the catalogue.
    prior_insights:
      farrens22_pipeline_masks:
        claim: >-
          The published ShapePipe pipeline generated its own masks, including
          Messier objects and CCD borders, and applied them to the images; the
          current pipeline generates none.
        created_at: "2022-06-01T00:00:00Z"
        evidence:
          - id: ev_farrens22_masks
            doi: "10.48550/arXiv.2206.14689"
            quote:
              exact: 'Messier objects, and border regions.'
            location: { page: 2 }

  # ═════════════════════════════════════════════════════════════════════════
  detection:
    description: >-
      Object detection with SExtractor on r-band tiles (the galaxy sample) and
      on single-exposure CCDs (PSF-star candidates). Tiles follow the MegaPipe
      parameters of Gwyn's UNIONS tile catalogue; exposures keep ShapePipe's
      stock values.
    inputs:
      - id: tile_stack
        type: data
        source: MegaPipe r-band tile stack + weight (uncompressed, merged headers)
    outputs:
      - id: tile_sexcat
        type: data
        format: fits
        description: Per-tile SExtractor LDAC catalogue with per-epoch CCD membership.
        inputs: [tile_stack]
        decisions:
          [detection_threshold_policy, deblending_policy, background_model,
           weight_map_usage, zero_weight_interpolation, detection_source_mode,
           epoch_membership_ccd_bounds, photometry_parameters,
           spurious_detection_cleaning, blend_photometry_mask_type,
           saturation_level]
    decisions:
      detection_threshold_policy:
        label: Detection significance, minimum area, matched filter
        rationale: >-
          Tiles: DETECT_THRESH and ANALYSIS_THRESH 1.0 sigma,
          DETECT_MINAREA 3, filtered with a 7x7 Gaussian of FWHM 3
          px (gauss_3.0_7x7.conv), near the CFIS average seeing of
          0.65 arcsec (about 3.5 px at 0.187 arcsec/px; the .sex
          files set SEEING_FWHM 0.6). These are the parameters of
          the MegaPipe tile catalogue, so ShapePipe's galaxy sample
          matches the catalogue UNIONS adopts. Exposures: 1.5 sigma,
          minarea 5, the 3x3 FWHM 2 px kernel (default.conv); they
          only feed star selection. Guinot+22 lists 1.5 sigma,
          minarea 10 and the default 3x3 kernel, so the tiles differ
          from the paper on all three.
          Anchor: workflow/config/cfis/default_tile.sex#DETECT_THRESH = 1.0;
          workflow/config/cfis/default_tile.sex#ANALYSIS_THRESH = 1.0;
          workflow/config/cfis/default_tile.sex#DETECT_MINAREA = 3;
          workflow/config/cfis/default_tile.sex#FILTER = Y;
          workflow/config/cfis/default_tile.sex#SEEING_FWHM = 0.6;
          workflow/config/cfis/config_tile_Sx.ini#SEXTRACTOR_RUNNER.DOT_CONV_FILE = $SP_CONFIG/gauss_3.0_7x7.conv;
          workflow/config/cfis/gauss_3.0_7x7.conv;
          workflow/config/cfis/default_exp.sex#DETECT_THRESH = 1.5;
          workflow/config/cfis/default_exp.sex#ANALYSIS_THRESH = 1.5;
          workflow/config/cfis/default_exp.sex#DETECT_MINAREA = 5;
          workflow/config/cfis/default_exp.sex#FILTER = Y;
          workflow/config/cfis/default_exp.sex#SEEING_FWHM = 0.6;
          workflow/config/cfis/config_exp_psfex.ini#SEXTRACTOR_RUNNER.DOT_CONV_FILE = $SP_CONFIG/default.conv;
          workflow/config/cfis/default.conv.
        default: megapipe_tiles
        options:
          megapipe_tiles:
            label: MegaPipe values on tiles; stock values on exposures
            insights: [guinot22_cfis_seeing]
          stock_tiles:
            label: Stock ShapePipe values on tiles (1.5 sigma, minarea 5, FWHM 2 px)
            insights: [guinot22_sextractor_params]
            excluded: true
            excluded_reason: >-
              Triggers spuriously on about 10% of grid-placed Sersic galaxies
              in image simulations, and does not match the MegaPipe tile
              catalogue.
      deblending_policy:
        label: Deblending contrast
        rationale: >-
          DEBLEND_NTHRESH 32 on both passes; DEBLEND_MINCONT 0.002
          on tiles (the MegaPipe value) and 0.001 on exposures.
          Contrast sets object count, centroids, and blend
          contamination in shapes. Guinot+22 lists 0.001.
          Anchor: workflow/config/cfis/default_tile.sex#DEBLEND_MINCONT = 0.002;
          workflow/config/cfis/default_exp.sex#DEBLEND_MINCONT = 0.001;
          workflow/config/cfis/default_tile.sex#DEBLEND_NTHRESH = 32;
          workflow/config/cfis/default_exp.sex#DEBLEND_NTHRESH = 32.
        default: megapipe_tiles
        options:
          megapipe_tiles:
            label: MINCONT 0.002 tiles / 0.001 exposures
            insights: [guinot22_sextractor_params]
          mincont_5em4_tiles:
            label: MINCONT 0.0005 on tiles
            excluded: true
            excluded_reason: >-
              Part of the stock tile parameter set rejected in favour of the
              MegaPipe values (see detection_threshold_policy).
      background_model:
        label: Background estimation and photometric background
        rationale: >-
          Both passes estimate the background with SExtractor AUTO. Tiles use
          the MegaPipe mesh BACK_SIZE 512 with BACK_FILTERSIZE 9 and a LOCAL
          photometric background (annulus BACKPHOTO_THICK 30); exposures use
          mesh 64, filter 3 and a GLOBAL photometric background. The exposure
          BACKGROUND and BACKGROUND_RMS maps are also what ngmix subtracts from
          each epoch and weights its pixels by
          (shape_measurement.galaxy_pixel_weights). The header background path
          is off (BKG_FROM_HEADER=False). Residual sky offsets propagate into
          thresholds, fluxes, completeness and shapes.
          Anchor: workflow/config/cfis/default_tile.sex#BACK_TYPE = AUTO;
          workflow/config/cfis/default_tile.sex#BACK_SIZE = 512;
          workflow/config/cfis/default_tile.sex#BACK_FILTERSIZE = 9;
          workflow/config/cfis/default_tile.sex#BACKPHOTO_TYPE = LOCAL;
          workflow/config/cfis/default_tile.sex#BACKPHOTO_THICK = 30;
          workflow/config/cfis/default_exp.sex#BACK_TYPE = AUTO;
          workflow/config/cfis/default_exp.sex#BACK_SIZE = 64;
          workflow/config/cfis/default_exp.sex#BACK_FILTERSIZE = 3;
          workflow/config/cfis/default_exp.sex#BACKPHOTO_TYPE = GLOBAL;
          workflow/config/cfis/config_exp_psfex.ini#SEXTRACTOR_RUNNER.BKG_FROM_HEADER = False;
          workflow/config/cfis/config_tile_Sx.ini#SEXTRACTOR_RUNNER.BKG_FROM_HEADER = False;
          src/shapepipe/modules/sextractor_package/sextractor_script.py::SExtractorCaller.get_background.
        default: auto_megapipe_tiles
        options:
          auto_megapipe_tiles:
            label: AUTO everywhere; MegaPipe mesh and LOCAL photometry on tiles
          manual_zero_tiles:
            label: Tile background fixed to 0, trusting the stack subtraction
            excluded: true
            excluded_reason: >-
              Part of the stock tile parameter set rejected in favour of the
              MegaPipe values (see detection_threshold_policy).
      weight_map_usage:
        label: Weight map as inverse variance for detection
        rationale: >-
          WEIGHT_TYPE MAP_WEIGHT on both passes (SExtractor default
          NONE): the per-pixel variance sets the effective SNR and
          so the detection set. RESCALE_WEIGHTS and WEIGHT_GAIN are
          Y, their SExtractor defaults. Guinot+22 keeps every non-tabulated
          parameter at its default, which would mean no weight map.
          Anchor: workflow/config/cfis/default_tile.sex#WEIGHT_TYPE = MAP_WEIGHT;
          workflow/config/cfis/default_exp.sex#WEIGHT_TYPE = MAP_WEIGHT;
          workflow/config/cfis/default_tile.sex#RESCALE_WEIGHTS = Y;
          workflow/config/cfis/default_exp.sex#RESCALE_WEIGHTS = Y;
          workflow/config/cfis/default_tile.sex#WEIGHT_GAIN = Y;
          workflow/config/cfis/default_exp.sex#WEIGHT_GAIN = Y;
          src/shapepipe/modules/sextractor_package/sextractor_script.py::SExtractorCaller.set_input_files.
        default: map_weight
        options:
          map_weight:
            label: MAP_WEIGHT
          no_weight:
            label: No weight map (SExtractor default)
            insights: [guinot22_sextractor_params]
      zero_weight_interpolation:
        label: Interpolation across zero-weight pixels
        rationale: >-
          INTERP_TYPE ALL on both passes (SExtractor default NONE), with
          INTERP_MAXXLAG/INTERP_MAXYLAG 16: SExtractor invents flux across
          zero-weight pixels, which changes detections and photometry near
          masked regions. No rationale is recorded.
          Anchor: workflow/config/cfis/default_tile.sex#INTERP_TYPE = ALL;
          workflow/config/cfis/default_exp.sex#INTERP_TYPE = ALL;
          workflow/config/cfis/default_tile.sex#INTERP_MAXXLAG = 16;
          workflow/config/cfis/default_tile.sex#INTERP_MAXYLAG = 16;
          workflow/config/cfis/default_exp.sex#INTERP_MAXXLAG = 16;
          workflow/config/cfis/default_exp.sex#INTERP_MAXYLAG = 16.
        default: interp_all
        options:
          interp_all:
            label: INTERP_TYPE ALL
          no_interpolation:
            label: INTERP_TYPE NONE
      spurious_detection_cleaning:
        label: Cleaning of spurious detections
        rationale: >-
          CLEAN Y with CLEAN_PARAM 1.0 on both passes deletes detections
          consistent with being wings of a brighter neighbour, a post-deblend
          change to the object list. Stock value; no rationale recorded.
          Anchor: workflow/config/cfis/default_tile.sex#CLEAN_PARAM = 1.0;
          workflow/config/cfis/default_exp.sex#CLEAN_PARAM = 1.0;
          workflow/config/cfis/default_tile.sex#CLEAN = Y;
          workflow/config/cfis/default_exp.sex#CLEAN = Y.
        default: clean_1
        options:
          clean_1:
            label: CLEAN Y, CLEAN_PARAM 1.0
      blend_photometry_mask_type:
        label: Neighbour pixels in blend photometry
        rationale: >-
          MASK_TYPE CORRECT on both passes replaces pixels belonging to a
          neighbour by their mirror across the object centre during
          photometry, changing fluxes and windowed moments of blends. Stock
          value; no rationale recorded.
          Anchor: workflow/config/cfis/default_tile.sex#MASK_TYPE = CORRECT;
          workflow/config/cfis/default_exp.sex#MASK_TYPE = CORRECT.
        default: correct
        options:
          correct:
            label: MASK_TYPE CORRECT
          blank:
            label: MASK_TYPE BLANK
      saturation_level:
        label: Saturation level read from each image's header
        rationale: >-
          SATUR_KEY SATURATE on both passes and no SATUR_LEVEL: SExtractor
          takes each image's saturation level from its SATURATE header card and
          sets the saturation bit (4) of FLAGS on objects with saturated
          pixels. Star selection requires FLAGS == 0 at every step, so the
          level decides which bright stars are rejected from the PSF sample;
          tile FLAGS reach the catalogue for downstream cuts. Where the card is
          absent, SExtractor falls back to SATUR_LEVEL, which neither .sex file
          sets, so its built-in default applies (50000 ADU per the SExtractor
          documentation). Whether the delivered exposure CCDs and MegaPipe
          tiles carry SATURATE is unverified here.
          Anchor: workflow/config/cfis/default_exp.sex#SATUR_KEY = SATURATE;
          workflow/config/cfis/default_tile.sex#SATUR_KEY = SATURATE;
          workflow/config/cfis/star_selection.setools#MASK:star_selection.FLAGS = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:preselect.FLAGS = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:flag.FLAGS = "== 0".
        default: header_saturate
        options:
          header_saturate:
            label: SATURATE header card; SExtractor default level where absent
          fixed_level:
            label: Fixed SATUR_LEVEL set in the .sex files
      photometry_parameters:
        label: Kron and aperture photometry definitions
        rationale: >-
          PHOT_AUTOPARAMS 2.5,3.5 (Kron factor, minimum radius), PHOT_APERTURES
          5 px and PHOT_FLUXFRAC 0.5 on both passes. MAG_AUTO is the axis of
          the star-selection magnitude window and the catalogue magnitude;
          FLUX_AUTO is PSFEx's photometric normalisation. A different Kron
          factor shifts magnitudes and so every magnitude-based cut. Stock
          values; no rationale recorded.
          Anchor: workflow/config/cfis/default_tile.sex#PHOT_AUTOPARAMS = 2.5,3.5;
          workflow/config/cfis/default_exp.sex#PHOT_AUTOPARAMS = 2.5,3.5;
          workflow/config/cfis/default_tile.sex#PHOT_APERTURES = 5;
          workflow/config/cfis/default_exp.sex#PHOT_APERTURES = 5;
          workflow/config/cfis/default_tile.sex#PHOT_FLUXFRAC = 0.5;
          workflow/config/cfis/default_exp.sex#PHOT_FLUXFRAC = 0.5;
          workflow/config/cfis/default.psfex#PHOTFLUX_KEY = FLUX_AUTO.
        default: kron_25_35
        options:
          kron_25_35:
            label: Kron 2.5/3.5, aperture 5 px, FLUXFRAC 0.5
      detection_source_mode:
        label: Single-image, unflagged detection on the r-band tile
        rationale: >-
          DETECTION_IMAGE=False and FLAG_IMAGE=False with the
          default_noimaflags.param column list: tiles have no instrument flag
          image and no detection coadd exists, so detection sees every tile
          pixel and the tile catalogue carries no IMAFLAGS_ISO. [LINT]
          final_cat.param, read by the post-processing merge, requests
          IMAFLAGS_ISO, which the tile chain never produces.
          Anchor: workflow/config/cfis/config_tile_Sx.ini#SEXTRACTOR_RUNNER.DETECTION_IMAGE = False;
          workflow/config/cfis/config_tile_Sx.ini#SEXTRACTOR_RUNNER.FLAG_IMAGE = False;
          workflow/config/cfis/default_noimaflags.param;
          workflow/config/cfis/final_cat.param#IMAFLAGS_ISO.
        default: sx_nomask_single_image
        options:
          sx_nomask_single_image:
            label: Unflagged single-image r-band detection
            insights: [guinot22_stacked_detection]
          masked_tile:
            label: Detection on a tile masked by rasterised sky masks
            description: >-
              Not implemented; no tile pixel mask exists (see
              masking.pixel_mask_source).
          dual_image_coadd:
            label: Dual-image mode with a detection coadd
            description: Not implemented; no UNIONS detection coadd exists.
      epoch_membership_ccd_bounds:
        label: Which exposure CCDs an object belongs to (N_EPOCH)
        rationale: >-
          CCD_SIZE = 33,2080,1,4612 with strict inequalities bounds
          each CCD's usable x range, and a WCS inversion failure
          skips the CCD, lowering N_EPOCH. This sets how many
          exposures enter each galaxy's multi-epoch fit. The x endpoints
          33 and 2080 match MegaCam's raw DATASEC (2048 pixel indices
          inclusively), but the strict cut excludes both endpoints.
          The excluded strip is likely prescan; that interpretation is
          unverified here.
          Anchor: workflow/config/cfis/config_tile_Sx.ini#SEXTRACTOR_RUNNER.CCD_SIZE = 33,2080,1,4612;
          src/shapepipe/modules/sextractor_package/sextractor_script.py::make_post_process;
          src/shapepipe/modules/sextractor_package/sextractor_script.py::ccd_candidate_mask.
        default: trimmed_bounds_33_2080
        options:
          trimmed_bounds_33_2080:
            label: "x in (33,2080), y in (1,4612), strict"
          inclusive_bounds:
            label: Same bounds, inclusive
    prior_insights:
      guinot22_sextractor_params:
        claim: >-
          The published tile detection uses DETECT_THRESH 1.5, DETECT_MINAREA
          10, the default 3x3 filter and DEBLEND_MINCONT 0.001, with every
          other SExtractor parameter at its default.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_table2
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'Table 2. SExtractor parametrisation. All other parameters are kept to their default values.'
            location: { page: 5 }
          - id: ev_guinot22_mincont
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'DEBLEND_MINCONT 0.001'
            location: { page: 5 }
          - id: ev_guinot22_minarea
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'DETECT_MINAREA 10'
            location: { page: 5 }
      guinot22_cfis_seeing:
        claim: >-
          CFIS r-band data have an average seeing of 0.65 arcsec.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_seeing
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'is taking r-band data with an average seeing of 0.65 arcsec'
            location: { page: 1 }
      guinot22_stacked_detection:
        claim: >-
          Source extraction in the published analysis is performed on the
          stacked tile images, for signal-to-noise and because artefacts are
          suppressed relative to single exposures.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_stacked_detection
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'We do the extraction on stacked images which provide a better signal-to-noise ratio, and most artifacts have a reduced amplitude with respect to single exposures'
            location: { page: 5 }

  # ═════════════════════════════════════════════════════════════════════════
  preparation:
    description: >-
      How exposures, astrometry, epoch lists and stamps are prepared before
      anything is measured.
    inputs:
      - id: exposure_files
        type: data
        source: delivered CFIS exposure triplets (image/weight/flag MEF) + tile stacks
    outputs:
      - id: epoch_stamps
        type: data
        format: sqlite
        description: Per-object multi-epoch vignets + per-CCD WCS log feeding ngmix.
        inputs: [exposure_files]
        decisions:
          [astrometric_solution_source, ccd_split_extent,
           epoch_provenance_from_tile_history, object_position_columns,
           stamp_positioning_and_padding]
    decisions:
      astrometric_solution_source:
        label: Astrometry taken verbatim from delivered per-CCD headers
        rationale: >-
          split_exp builds WCS(header) from each raw CCD header, and
          merge_headers stores the lot; every downstream world-to-pixel
          transform (stamp placement, epoch membership, position seeding) uses
          that solution. [HARDCODED] no re-derivation or astrometric refinement
          exists. A joint re-fit would move every stamp centre and position
          seed.
          Anchor: src/shapepipe/modules/split_exp_package/split_exp.py::SplitExposures.create_hdus;
          src/shapepipe/modules/merge_headers_package/merge_headers.py::merge_headers.
        default: delivered_headers
        options:
          delivered_headers:
            label: WCS(header) verbatim, stored at split time
            insights: [guinot22_gaia_astrometry]
          astrometric_refit:
            label: Joint astrometric re-solution
            description: Not implemented.
      ccd_split_extent:
        label: All 40 MegaCam HDUs split and carried as candidate epochs
        rationale: >-
          N_HDU=40, and any other HDU count raises: every one of the
          40 CCDs is a candidate epoch wherever the WCS lands it.
          Excluding a subset of CCDs is the alternative.
          Anchor: workflow/config/cfis/config_exp_Sp.ini#SPLIT_EXP_RUNNER.N_HDU = 40;
          src/shapepipe/modules/split_exp_package/split_exp.py::SplitExposures.create_hdus.
        default: all_40_hdus
        options:
          all_40_hdus:
            label: 40 HDUs, hard-fail on any other count
            insights: [guinot22_forty_chips]
          exclude_ccd_subset:
            label: Exclude a subset of CCDs as epochs
            description: Not implemented.
      epoch_provenance_from_tile_history:
        label: Epoch sets parsed from tile FITS HISTORY cards
        rationale: >-
          A tile's contributing exposures are the file names in
          column 3 (COLNUM) of each HISTORY line, stripped of their
          extension and deduplicated: the coadd's own provenance is
          trusted as the epoch list. Names keep their trailing p
          (2243881p); downstream code drops it when it needs the
          bare exposure ID. A mis-parse changes N_EPOCH and which
          exposures are fit. [LINT] EXP_PREFIX = p is passed to
          removeprefix, which does nothing to names where p is a
          suffix, so the key has no effect.
          Anchor: workflow/config/cfis/config_tile_Fe.ini#FIND_EXPOSURES_RUNNER.COLNUM = 3;
          workflow/config/cfis/config_tile_Fe.ini#FIND_EXPOSURES_RUNNER.EXP_PREFIX = p;
          src/shapepipe/modules/find_exposures_package/find_exposures.py::FindExposures.get_exposure_list.
        default: history_parse
        options:
          history_parse:
            label: HISTORY column 3, prefix p, deduplicated
      object_position_columns:
        label: Windowed centroids (XWIN/YWIN) define every position
        rationale: >-
          PSF interpolation sites, tile and multi-epoch stamp
          centres, and the catalogue position all use SExtractor's
          windowed centroid. Tile stamps are cut at
          XWIN_IMAGE/YWIN_IMAGE in tile pixels (COORD = PIX); PSF
          interpolation and multi-epoch stamps use
          XWIN_WORLD/YWIN_WORLD; exposure-side PSF validation uses
          XWIN_IMAGE/YWIN_IMAGE. Windowed, isophotal and model
          centroids differ systematically for blends and asymmetric
          galaxies, and the centroid feeds the position seed and the
          centroid prior.
          Anchor: workflow/config/cfis/config_tile_PiViVi_psfex.ini#VIGNETMAKER_RUNNER_RUN_1.POSITION_PARAMS = XWIN_IMAGE,YWIN_IMAGE;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#VIGNETMAKER_RUNNER_RUN_1.COORD = PIX;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#PSFEX_INTERP_RUNNER.POSITION_PARAMS = XWIN_WORLD,YWIN_WORLD;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#VIGNETMAKER_RUNNER_RUN_2.POSITION_PARAMS = XWIN_WORLD,YWIN_WORLD;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#VIGNETMAKER_RUNNER_RUN_2.COORD = SPHE;
          workflow/config/cfis/config_exp_psfex.ini#PSFEX_INTERP_RUNNER.POSITION_PARAMS = XWIN_IMAGE,YWIN_IMAGE.
        default: xwin_windowed
        options:
          xwin_windowed:
            label: Windowed centroids everywhere
      stamp_positioning_and_padding:
        label: Nearest-pixel stamp extraction with zero padding
        rationale: >-
          [HARDCODED] stamps are cut around the pixel nearest the
          object's position, with no sub-pixel interpolation; the
          sub-pixel remainder is stored as the stamp's OFFSET, which
          ngmix uses as the Jacobian origin
          (shape_measurement.centroid_source), so extraction and
          centroid prior share one rounding. Multi-epoch stamps take
          the position from the tile world coordinate through the
          stored per-CCD WCS. Objects whose stamp overruns an image
          edge are kept, with out-of-image pixels zero-filled. A
          stamp centre that rounds outside the image raises, which
          fails the vignet run for the whole tile.
          Anchor: src/shapepipe/modules/vignetmaker_package/vignetmaker.py::get_stamps;
          src/shapepipe/modules/vignetmaker_package/vignetmaker.py::VignetMaker._get_stamp_me.
        default: round_and_zero_pad
        options:
          round_and_zero_pad:
            label: Nearest-pixel extraction, zero padding, no edge rejection
    prior_insights:
      guinot22_gaia_astrometry:
        claim: >-
          The astrometric solution the analysis relies on is the upstream
          MegaPipe/Gaia DR2 calibration, accurate to within 20 mas; no
          astrometric re-fit inside the pipeline is described.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_astrometry
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'An astrometric calibration within 20 mas was achieved using the Gaia DR2 observations'
            location: { page: 2 }
      guinot22_forty_chips:
        claim: >-
          Star selection and PSF modelling are carried out independently on
          each of the 40 MegaCam chips, with no chip excluded.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_forty_chips
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'is performed independently on each of the 40 chips that constitute the MegaCAM'
            location: { page: 3 }

  # ═════════════════════════════════════════════════════════════════════════
  star_selection_psf:
    description: >-
      Which objects constrain the PSF, the PSF model itself, and which CCD
      models are good enough to use.
    inputs:
      - id: exposure_sexcat
        type: data
        source: per-CCD exposure SExtractor catalogues (default_exp.sex run)
    outputs:
      - id: psf_model
        type: data
        format: psf
        description: >-
          Per-CCD PSF models and the PSFs interpolated at object positions,
          with HSM shape diagnostics.
        inputs: [exposure_sexcat]
        decisions:
          [star_selection_box, psf_train_validation_split,
           psfex_candidate_vetting, psf_modelling_software,
           psf_model_complexity, psf_acceptance_thresholds]
    decisions:
      star_selection_box:
        label: Stellar-locus selection, magnitude window and FWHM window around the mode
        rationale: >-
          18 < MAG_AUTO < 22, |FWHM - mode| <= 0.2 px, FLAGS == 0
          and IMAFLAGS_ISO == 0. The mode is computed on a
          preselection (MAG_AUTO < 21, FWHM 0.3-1.5 arcsec at 0.187
          arcsec/px) by an iterative histogram-zoom estimator that
          falls back to the median below 20 objects, so small-N
          behaviour changes selection on sparse CCDs. PSFEx's own
          selection is off (SAMPLE_AUTOSELECT N); see
          psfex_candidate_vetting for what PSFEx may still apply.
          [LINT] the file's statistics log the FWHM cut as mode +-
          0.1 px and its plot uses 0.186 arcsec/px, while the
          applied cut is +- 0.2 px at 0.187; the _mode docstring
          puts the median fallback at 10 objects, the code at 20.
          Anchor: workflow/config/cfis/star_selection.setools#MASK:star_selection.FLAGS = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:preselect.FLAGS = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:star_selection.IMAFLAGS_ISO = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:preselect.IMAFLAGS_ISO = "== 0";
          workflow/config/cfis/star_selection.setools#MASK:star_selection.MAG_AUTO = ["> 18.", "< 22."];
          workflow/config/cfis/star_selection.setools#MASK:star_selection.FWHM_IMAGE = ["<= mode(FWHM_IMAGE{preselect}) + 0.2", ">= mode(FWHM_IMAGE{preselect}) - 0.2"];
          workflow/config/cfis/star_selection.setools#MASK:preselect.MAG_AUTO = ["> 0", "< 21"];
          workflow/config/cfis/star_selection.setools#MASK:preselect.FWHM_IMAGE = ["> 0.3 / 0.187", "< 1.5 / 0.187"];
          workflow/config/cfis/star_selection.setools#PLOT:fwhm_field.SCATTER = "FWHM_IMAGE{star_selection}*0.186";
          workflow/config/cfis/default.psfex#SAMPLE_AUTOSELECT = N;
          src/shapepipe/pipeline/str_handler.py::StrInterpreter._mode.
        default: mode_centred_box
        options:
          mode_centred_box:
            label: FWHM-mode-centred box, +-0.2 px, mag 18-22
            insights: [guinot22_star_box]
          size_mag_locus_fit:
            label: Fitted size-magnitude stellar locus
            description: Not implemented.
          psfex_autoselect:
            label: PSFEx SAMPLE_AUTOSELECT vetting on top
            insights: [guinot22_psfex_preselection_off]
            excluded: true
            excluded_reason: >-
              Disabled so that the pipeline's own star selection is the only
              one.
      psf_train_validation_split:
        label: Seeded 80/20 star split, model fit vs held-out validation
        rationale: >-
          RAND_SPLIT RATIO 20: the 80% sample fits the PSFEx model
          and feeds the tile multi-epoch interpolation
          (ME_DOT_PSF_PATTERN); the 20% sample is the independent
          residual diagnostic (psfex_interp VALIDATION mode). The
          split trades training stars per CCD, which interacts with
          the acceptance gate, against an independent residual test.
          It is deterministic: a permutation seeded from the digits
          of the unit's file number, so a given CCD gets the same
          split on every run.
          Anchor: workflow/config/cfis/star_selection.setools#RAND_SPLIT:star_split.RATIO = 20;
          src/shapepipe/modules/setools_package/setools.py::SETools._make_rand_split;
          workflow/config/cfis/config_exp_psfex.ini#PSFEX_RUNNER.FILE_PATTERN = star_split_ratio_80;
          workflow/config/cfis/config_exp_psfex.ini#PSFEX_INTERP_RUNNER.FILE_PATTERN = star_split_ratio_80,star_split_ratio_20,psfex_cat;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#PSFEX_INTERP_RUNNER.ME_DOT_PSF_PATTERN = star_split_ratio_80.
        default: split_80_20_seeded
        options:
          split_80_20_seeded:
            label: 80% train / 20% validation, seeded from the file number
            insights: [guinot22_star_split]
          split_80_20_unseeded:
            label: Same split from an unseeded random draw
            excluded: true
            excluded_reason: >-
              Makes the PSF star sample, and every shape downstream of it,
              irreproducible run-to-run.
          no_holdout:
            label: All stars in the model, no held-out diagnostic
            excluded: true
            excluded_reason: Loses the independent residual and rho-statistic input.
      psfex_candidate_vetting:
        label: PSFEx built-in candidate cuts, unpinned
        rationale: >-
          default.psfex sets SAMPLE_AUTOSELECT N but omits
          SAMPLE_MINSN, SAMPLE_MAXELLIP, SAMPLE_FWHMRANGE and
          SAMPLE_VARIABILITY, so [HARDCODED] whatever PSFEx compiles
          in for them governs, changing with the PSFEx version;
          which of these cuts still act with SAMPLE_AUTOSELECT N is
          unverified. BADPIXEL_FILTER N and PSF_RECENTER N accept
          flagged star vignets unfiltered and do not recentre
          candidates.
          Anchor: workflow/config/cfis/default.psfex#SAMPLE_AUTOSELECT = N;
          workflow/config/cfis/default.psfex#BADPIXEL_FILTER = N;
          workflow/config/cfis/default.psfex#PSF_RECENTER = N.
        default: builtin_defaults
        options:
          builtin_defaults:
            label: PSFEx built-in SAMPLE_* values, no bad-pixel filter
          pinned_explicit:
            label: Write the SAMPLE_* values explicitly into default.psfex
      psf_modelling_software:
        label: PSF model, PSFEx per CCD or MCCD over the focal plane
        rationale: >-
          workflow/config.yaml psf_model selects the exposure and
          tile config pair; the committed value is psfex, which fits
          each CCD independently. MCCD (Liaudat+2021) fits one
          hybrid local+global model over the focal plane
          (FP_GEOMETRY CFIS; N_COMP_LOC 8, D_COMP_GLOB 8,
          MIN_N_STARS 20, RMSE_THRESH 1.25); the completeness table
          treats its counts as warnings because no campaign has run
          it. [LINT] config_exp_mccd.ini still reads pipeline_flag
          images from mask_runner, which no longer exists, so the
          MCCD exposure chain cannot run as committed.
          Anchor: workflow/config.yaml;
          workflow/config/cfis/config_MCCD.ini#INSTANCE.N_COMP_LOC = 8;
          workflow/config/cfis/config_MCCD.ini#INSTANCE.D_COMP_GLOB = 8;
          workflow/config/cfis/config_MCCD.ini#INSTANCE.FP_GEOMETRY = CFIS;
          workflow/config/cfis/config_MCCD.ini#INSTANCE.RMSE_THRESH = 1.25;
          workflow/config/cfis/config_MCCD.ini#INPUTS.MIN_N_STARS = 20;
          workflow/config/cfis/config_exp_mccd.ini#SEXTRACTOR_RUNNER.INPUT_MODULE = split_exp_runner,mask_runner;
          workflow/config/cfis/config_exp_mccd.ini#SEXTRACTOR_RUNNER.FILE_PATTERN = image,weight,pipeline_flag;
          src/shapepipe/modules/mccd_package.
        default: psfex
        options:
          psfex:
            label: PSFEx, independent per-CCD models
            insights: [guinot22_psfex_software, farrens22_two_psf_methods]
          mccd_focal_plane:
            label: MCCD hybrid local+global focal-plane model
            insights: [farrens22_two_psf_methods]
      psf_model_complexity:
        label: PSFEx pixel basis with degree-2 spatial variation per CCD
        rationale: >-
          BASIS_TYPE PIXEL, BASIS_NUMBER 20, PSF_SAMPLING 1, PSFVAR_DEGREES 2
          in XWIN/YWIN per CCD. PSF_ACCURACY 0.01 is the fractional accuracy
          PSFEx assumes for PSF pixel values, which per the PSFEx documentation
          enters the fit weights and so how closely the model follows bright
          stars. Model flexibility sets the balance between PSF leakage and
          overfitting, the dominant additive systematic in cosmic shear. Stock
          values; no rationale recorded.
          Anchor: workflow/config/cfis/default.psfex#BASIS_TYPE = PIXEL;
          workflow/config/cfis/default.psfex#PSF_ACCURACY = 0.01;
          workflow/config/cfis/default.psfex#BASIS_NUMBER = 20;
          workflow/config/cfis/default.psfex#PSFVAR_DEGREES = 2;
          workflow/config/cfis/default.psfex#PSF_SAMPLING = 1;
          workflow/config/cfis/default.psfex#PSFVAR_KEYS = XWIN_IMAGE,YWIN_IMAGE;
          workflow/config/cfis/default.psfex#MEF_TYPE = INDEPENDENT.
        default: pixel_basis_deg2_per_ccd
        options:
          pixel_basis_deg2_per_ccd:
            label: PIXEL basis, degree 2, per CCD
            insights: [guinot22_psf_no_oversampling]
          deg3:
            label: Degree-3 spatial variation
            description: Needs more stars per CCD than the acceptance gate guarantees.
      psf_acceptance_thresholds:
        label: Per-CCD PSF-model quality gate
        rationale: >-
          A CCD whose model has ACCEPTED < STAR_THRESH = 22 or CHI2
          > CHI2_THRESH = 2 is not interpolated, on both the
          validation and the multi-epoch pass; 22 applies the
          published floor to the 80% training sample. In the science
          path the CCD's epoch is dropped for every object on it; an
          object left with no epoch has no shape. There is no
          minimum-epoch floor in the pipeline: NGMIX_N_EPOCH records
          what survived and epoch-count cuts happen downstream.
          Guinot+22 describes discarding the CCD from PSF estimation
          rather than gating at interpolation.
          Anchor: src/shapepipe/modules/psfex_interp_package/psfex_interp.py::PSFExInterpolator.interpsfex;
          workflow/config/cfis/config_exp_psfex.ini#PSFEX_INTERP_RUNNER.STAR_THRESH = 22;
          workflow/config/cfis/config_exp_psfex.ini#PSFEX_INTERP_RUNNER.CHI2_THRESH = 2;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#PSFEX_INTERP_RUNNER.STAR_THRESH = 22;
          workflow/config/cfis/config_tile_PiViVi_psfex.ini#PSFEX_INTERP_RUNNER.CHI2_THRESH = 2.
        default: stars22_chi2_2
        options:
          stars22_chi2_2:
            label: ">= 22 stars and chi2 <= 2 on both passes"
            insights: [des_psf_blacklist_local, guinot22_star_floor_22_local]
          stars20_science_path:
            label: ">= 20 stars on the science path"
            excluded: true
            excluded_reason: >-
              20 is the pre-split floor; with 80% of stars in the model it gates
              below both the published floor and the validation pass.
          des_25:
            label: DES Y3 threshold (25 stars)
            excluded: true
            excluded_reason: >-
              CFIS CCDs are smaller than DECam's; the floor is survey-specific.
    prior_insights:
      des_psf_blacklist_local:
        claim: >-
          DES Y3 blacklists any CCD with fewer than 25 stars surviving
          outlier rejection in the PSF fit.
        created_at: "2026-07-16T00:00:00Z"
        evidence:
          - id: ev_jarvis_y3_local
            doi: "10.48550/arXiv.2011.03409"
            quote:
              exact: "fewer than 25 stars survived the outlier rejection"
            location: { page: 10 }
      guinot22_star_floor_22_local:
        claim: >-
          The published ShapePipe/UNIONS analysis discards a CCD from the PSF
          estimation when fewer than 22 stars are selected on it.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_star_floor_local
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'The dashed line represents the cut at 22 stars/CCD below which the CCD is discarded for the PSF estimation.'
            location: { page: 4 }
      guinot22_star_box:
        claim: >-
          The published star selection keeps objects whose FWHM lies within
          0.04 arcsec of the mode of a size preselection, restricted to the
          magnitude range 18 < r < 22.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_star_box
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'From this pre-selection we keep objects for which the FWHM is within 0.04 arcsec of the mode. In addition to these size cuts, we only use star candidates in the magnitude range 18 < r < 22.'
            location: { page: 4 }
      guinot22_star_split:
        claim: >-
          The published analysis randomly splits the star sample in two, 80%
          building the PSF model and 20% held out for the validation tests.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_star_split
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'To be able to perform these tests properly, our star sample has been randomly divided in two:'
            location: { page: 7 }
      guinot22_psfex_preselection_off:
        claim: >-
          PSFEx's internal pre-selection is deliberately disabled so that the
          pipeline's own star selection is the only one, the paper describing
          the model as fit on the entire star sample.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_preselection_off
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'Since we carry out our own star selection (see Sect. 4.1), we disable the internal PSFEx pre-selection, and the PSF is thus obtained using the entire star sample.'
            location: { page: 4 }
      guinot22_psfex_software:
        claim: >-
          The published UNIONS shear catalogue uses PSFEx for PSF modelling,
          with MCCD named as upcoming rather than current work.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_psfex_software
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'We make use of the PSFEx software package'
            location: { page: 4 }
      farrens22_two_psf_methods:
        claim: >-
          ShapePipe ships two PSF modelling methods, PSFEx and MCCD, either or
          both of which may be run and used for the galaxy shape measurement.
        created_at: "2022-06-01T00:00:00Z"
        evidence:
          - id: ev_farrens22_two_psf
            doi: "10.48550/arXiv.2206.14689"
            quote:
              exact: 'ShapePipe allows either or both methods to be run and subsequently used for the galaxy shape measurement.'
            location: { page: 3 }
      guinot22_psf_no_oversampling:
        claim: >-
          The PSFEx parametrisation is tabulated in the paper (pixel basis,
          degree-2 spatial variation), with the deliberate choice not to
          over-sample the PSF models.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_psf_complexity
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'The PSFEx parameters we used are presented in Table 1. We have chosen not to over-sample the PSF models.'
            location: { page: 5 }

  # ═════════════════════════════════════════════════════════════════════════
  shape_measurement:
    description: >-
      Galaxy shape estimation: joint multi-epoch ngmix Gaussian fits with
      metacalibration. Most choices here are fixed in code; this is where the
      silent-default risk concentrates.
    inputs:
      - id: vignets
        type: data
        source: multi-epoch galaxy, weight, flag, background and background-RMS vignets + interpolated PSFs
    outputs:
      - id: ngmix_cat
        type: data
        format: fits
        description: Per-tile metacal shear catalogue chunks (ngmix_runner family).
        inputs: [vignets]
        decisions:
          [ngmix_seed_mode, galaxy_model, fit_initialisation, fit_priors,
           metacal_scheme, centroid_source, epoch_flux_rescaling,
           psf_epoch_averaging, galaxy_pixel_weights, psf_likelihood_noise,
           megacam_ccd_flip, defect_fill, blend_handling,
           epoch_masked_fraction_cut, central_defect_veto]
    decisions:
      ngmix_seed_mode:
        label: Per-object RNG seeded from sky position
        rationale: >-
          Each object's RNG (noise realisations, guesses, priors) is seeded
          from its position: [HARDCODED] 3-arcsec sky boxes offset by the
          first epoch's CCD number, folded and Cantor-paired mod 2^32. Every
          stream is a function of sky position, so results do not depend on
          how a tile is chunked, and metacal's fixnoise counter-noise cancels
          across image-simulation branches that share an object's box.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::position_seed;
          src/shapepipe/modules/ngmix_package/ngmix.py::Ngmix.process.
        default: position_seed
        options:
          position_seed:
            label: Per-object seed from (ra, dec, ccd), 3-arcsec boxes
          tile_seed:
            label: One tile-wide RandomState consumed in object order
            excluded: true
            excluded_reason: >-
              Makes every noise stream depend on chunk boundaries and object
              order.
      galaxy_model:
        label: Single-Gaussian galaxy and PSF models
        rationale: >-
          [HARDCODED] ngmix Fitter(model='gauss') for both the galaxy and the
          PSF. Under metacalibration, model bias largely cancels in the
          response, which is the standard defence of the Gaussian; the code
          does not state it.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::make_runners.
        default: gauss
        options:
          gauss:
            label: Single Gaussian
            insights: [guinot22_gaussian_model]
          exp_or_bdf:
            label: exp / bdf galaxy models
            description: Not exposed; make_runners fixes the model.
      fit_initialisation:
        label: Fit guesses and retries
        rationale: >-
          [HARDCODED] the galaxy guesser (TPSFFluxAndPriorGuesser)
          starts from T = 0.25 with a flux taken from a PSF-flux
          fit; the PSF guesser (TFluxGuesser) starts from T = 0.25
          and the catalogue flux. The galaxy runner retries 5 times,
          the PSF runner twice. With a non-convex likelihood the
          guess and retries decide which objects converge. A failed
          ngmix fit is flagged; any exception during an object's fit
          drops it with no ngmix row, leaving it to the catalogue
          sentinels (catalogue_assembly.failure_sentinels).
          Guinot+22 initialised the whole guess vector from HSM
          adaptive moments on each sheared image; the code does not.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::make_runners;
          src/shapepipe/modules/ngmix_package/ngmix.py::Ngmix.process.
        default: prior_guess_t025_ntry5_2
        options:
          prior_guess_t025_ntry5_2:
            label: T guess 0.25 + catalogue flux, ntry 5 / 2
          hsm_initialisation:
            label: Guesses from HSM adaptive moments (Guinot+22)
            insights: [guinot22_hsm_initialisation]
            description: Not implemented.
      fit_priors:
        label: ngmix joint prior
        rationale: >-
          [HARDCODED] ellipticity GPriorBA with sigma 0.4; flat T in
          [-1, 1e3] and flat F in [-100, 1e9], with negative support
          (the bounds decide which noisy fits survive and which
          rail); a centroid prior of width one pixel scale,
          PIXEL_SCALE 0.186 arcsec (derived from the WCS when the
          key is absent). The same joint prior also constrains the
          PSF fits: the PSF fitter is built with the galaxy prior.
          Prior width drives noise bias; no rationale recorded.
          Guinot+22 states a flat F in [-1e4, 1e9] and a flat prior
          on the half-light radius r50 rather than on T. [LINT] the epoch stamps are exposure
          pixels, and star selection uses 0.187 arcsec/px; the
          ngmix_runner comment says pixel scale also sets a noise
          window, but get_noise is never called.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::get_prior;
          src/shapepipe/modules/ngmix_package/ngmix.py::get_prior.T_range = -1,1e3;
          src/shapepipe/modules/ngmix_package/ngmix.py::get_prior.F_range = -100,1e9;
          src/shapepipe/modules/ngmix_package/ngmix.py::make_runners;
          workflow/config/cfis/config_tile_Ng_template.ini#NGMIX_RUNNER.PIXEL_SCALE = 0.186.
        default: gpriorba04_flat
        options:
          gpriorba04_flat:
            label: GPriorBA 0.4 + flat T/F with negative support
            insights: [guinot22_ngmix_priors]
          nonneg_informative:
            label: Non-negative or informative T/F priors
            excluded: true
            excluded_reason: >-
              Truncating negative support biases the noshear ensemble mean;
              metacal wants a symmetric noise response.
      metacal_scheme:
        label: Metacalibration protocol
        rationale: >-
          [HARDCODED] types noshear, 1p, 1m, 2p, 2m with step 0.01, fixnoise
          with the noise image, and ignore_failed_psf (an epoch whose PSF fit
          fails is dropped). The reconvolution kernel is METACAL_PSF, default
          fitgauss, not set in the committed config; it moves the response
          directly. No sheared-PSF types run, so the catalogue has no PSF
          response term.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::do_ngmix_metacal;
          src/shapepipe/modules/ngmix_package/ngmix.py::METACAL_TYPES = noshear,1p,1m,2p,2m;
          src/shapepipe/modules/ngmix_package/ngmix.py::do_ngmix_metacal.metacal_pars[types] = noshear,1p,1m,2p,2m;
          src/shapepipe/modules/ngmix_package/ngmix.py::do_ngmix_metacal.metacal_pars[step] = 0.01;
          src/shapepipe/modules/ngmix_package/ngmix.py::do_ngmix_metacal.metacal_pars[fixnoise] = True;
          src/shapepipe/modules/ngmix_package/ngmix.py::do_ngmix_metacal.metacal_pars[use_noise_image] = True;
          src/shapepipe/modules/ngmix_runner.py::ngmix_runner.
        default: five_types_step001_fitgauss
        options:
          five_types_step001_fitgauss:
            label: noshear+1p/1m/2p/2m, step 0.01, fitgauss, fixnoise
            insights: [guinot22_metacal_five_images]
          with_psf_response:
            label: Add sheared-PSF types for R_psf
            description: Not implemented.
      centroid_source:
        label: Jacobian origin at the coadd centroid
        rationale: >-
          The Jacobian origin, where the centroid prior centres, is the
          sub-pixel offset the stamp extractor stored when it cut the stamp
          ("wcs", the default at every level; the committed config sets no
          CENTROID_SOURCE). One projection and one rounding serve both
          extraction and prior, so they cannot disagree near a rounding tie.
          "hsm" re-centres on adaptive moments measured from the stamp.
          Anchor: src/shapepipe/modules/ngmix_runner.py::ngmix_runner;
          src/shapepipe/modules/ngmix_package/ngmix.py::make_ngmix_observation.
        default: wcs
        options:
          wcs:
            label: Coadd-centroid offset from the stamp extractor
          hsm:
            label: HSM adaptive-moment centroid
            excluded: true
            excluded_reason: >-
              Noisy, notably for stars, and follows the light rather than the
              astrometry that placed the stamp.
      epoch_flux_rescaling:
        label: Epochs put on a common flux scale by header FSCALE
        rationale: >-
          [HARDCODED] each epoch's image is multiplied by its header FSCALE and
          its weight divided by FSCALE squared (background RMS scaled with the
          image) before the joint fit, so the epochs share the tile's
          zero-point.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::rescale_epoch_fluxes.
        default: fscale
        options:
          fscale:
            label: Rescale by header FSCALE
      psf_epoch_averaging:
        label: Catalogue PSF quantities averaged over epochs by galaxy weight
        rationale: >-
          [HARDCODED] the PSF shape and size written to the catalogue (the
          original image PSF and the metacal reconvolution kernel) are averages
          over epochs weighted by the summed galaxy inverse variance of each
          epoch; epochs whose PSF fit failed are left out. These columns feed
          PSF-leakage estimates downstream.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::_average_psf_fits;
          src/shapepipe/modules/ngmix_package/ngmix.py::average_original_psf.
        default: galaxy_weight_sum
        options:
          galaxy_weight_sum:
            label: Weighted by summed galaxy inverse variance
      galaxy_pixel_weights:
        label: Per-pixel inverse variance from background-RMS vignets
        rationale: >-
          With BKG_RMS_VIGNET_PATH set, each pixel's weight is 1/rms^2 from the
          SExtractor background-RMS map (all or nothing; a missing file
          raises), and the noise realisations use the same per-pixel RMS; the
          fallback is a scalar 1/sigma_mad^2. A scalar sigma mis-reports errors
          wherever the RMS varies. Each epoch is background-subtracted with the
          SExtractor background vignet (BKG_SUB, on unless the key is set
          False).
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::prepare_ngmix_weights;
          src/shapepipe/modules/ngmix_package/ngmix.py::background_subtract;
          workflow/config/cfis/config_tile_Ng_template.ini#NGMIX_RUNNER.BKG_RMS_VIGNET_PATH = $NGMIX_VIGNET_DIR/vignetmaker_runner_run_2/output/background_rms_vignet{file_number_string}.sqlite.
        default: rms_vignet_weights
        options:
          rms_vignet_weights:
            label: Per-pixel background-RMS weights
          scalar_sigma_mad:
            label: Scalar sigma_mad per epoch
            excluded: true
            excluded_reason: Mis-reports errors wherever the RMS map varies.
      psf_likelihood_noise:
        label: Flat PSF-observation weight
        rationale: >-
          [HARDCODED] the PSF observation carries a flat weight 1/PSF_NOISE^2
          with PSF_NOISE 1e-5; without it the g-prior swamps the PSF
          likelihood. The recovered PSF shape and size are flat across 1e-4 to
          1e-6 on the digital twin.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::PSF_NOISE = 1e-5;
          src/shapepipe/modules/ngmix_package/ngmix.py::make_ngmix_observation.
        default: psf_noise_1em5
        options:
          psf_noise_1em5:
            label: PSF_NOISE 1e-5
      megacam_ccd_flip:
        label: 180-degree rotation of tile vignets for CCDs below 18 and 36-37
        rationale: >-
          [HARDCODED] "MegaPipe has CCDs that are upside down": the tile vignet
          and segmentation stamp are rotated to register with the epoch stamp.
          A wrong flip mis-registers the tile coverage flag against the epoch,
          changing flagged pixels and the masked-fraction cut. The docstring
          warns it gives incorrect results for THELI CCDs.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::Ngmix.MegaCamFlip.
        default: megapipe_flip
        options:
          megapipe_flip:
            label: Flip CCDs < 18 and 36/37 (MegaPipe orientation)
      defect_fill:
        label: Image content of flagged / zero-weight pixels before metacal
        rationale: >-
          prepare_ngmix_weights gives weight 0 to every pixel with a nonzero
          instrument flag, zero exposure weight or invalid background RMS. What
          the IMAGE holds in those pixels still matters, because metacal never
          looks at weights: ngmix builds a galsim InterpolatedImage from the
          whole observation image, deconvolves, shears and reconvolves it, and
          copies the weight map through unchanged. Whatever sits in a
          zero-weight pixel is therefore spread into the weighted pixels within
          about a PSF width, with ringing at sharp features. DES's own
          corrector (ngmixer) says why it fills: "it may be important for codes
          that take moments or use FFTs". The fill is coupled to the neighbour
          treatment through the single BLEND_HANDLING key, which the committed
          config leaves at its default. Under noisefill, masked pixels get an
          independent noise realisation at the per-pixel RMS. Under uberseg,
          the fill is skipped, so raw bad columns, bleeds, cosmic rays and
          bright-star light enter metacal. [LINT] the prepare_ngmix_weights
          docstring says noisefill keeps the weight of filled pixels (the code
          zeroes it), and the ngmix_runner comment says noisefill fills
          neighbour pixels (it fills flagged pixels and leaves neighbours
          untouched). No DES metacal pipeline passed raw defects through
          metacal: Y1 dropped every epoch with a masked pixel
          (max_zero_weight_frac 0.0), Y3 filled symmetrized defects with the
          best-fit central model (both candidate Y3 configs do this; which one
          was production is not recorded), and Y6 interpolated symmetrized
          defects in the image and in every noise image. The residual cost of
          any fill is anisotropy. A filled bad column that crosses the galaxy
          removes or misplaces light along one detector axis. The
          reconvolution spreads that into an additive e1-type term, coherent on
          the sky because CFHT/MegaCam, like DECam, has a fixed sky orientation
          (inferred from CFHT's equatorial mount, no derotator). Sheldon & Huff
          2017 saw a large additive e1 even with model fill, removed by a
          90-degree compensating mask. Every DES pipeline symmetrized the
          defect mask, and ShapePipe does not. The fill should be set
          independently of blend_handling; the recommended option is
          symmetrized_4fold_noise. A single 90-degree rotation is not enough:
          it leaves a coherent c2 of about -0.006 to -0.012 for columns 2-3 px
          off-centre, while the 4-fold OR gives |c| < 2e-4 (measured on
          feat/symmetrized-defect-fill).
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::prepare_ngmix_weights;
          src/shapepipe/modules/ngmix_package/ngmix.py::do_ngmix_metacal;
          src/shapepipe/modules/ngmix_runner.py::ngmix_runner.
        default: noise
        options:
          noise:
            label: Noise fill (BLEND_HANDLING = noisefill)
            description: >-
              Masked pixels are replaced by an independent noise realisation at
              the per-pixel background RMS and keep weight 0. Consistent with
              metacal's fixnoise noise image, which covers every pixel. Removes
              defects, but leaves an unsymmetrized hole in the galaxy light
              wherever a defect crosses the object, which can give an e1-type
              additive term.
            insights: [mask_metacal_acts_on_whole_stamp, mask_bad_column_symmetrize]
          raw:
            label: "No fill: raw defect values (BLEND_HANDLING = uberseg)"
            description: >-
              Masked pixels keep weight 0, but their raw values (bad columns,
              saturation, bleeds, cosmic rays, bright-star light) stay in the
              image that metacal deconvolves, shears and reconvolves.
            excluded: true
            excluded_reason: >-
              Metacal acts on every pixel regardless of weight, so raw defects
              leak into the weighted pixels. No published metacal pipeline does
              this: DES dropped, model-filled or interpolated defects. The code
              reaches this option only as a side effect of BLEND_HANDLING =
              uberseg.
            insights: [mask_metacal_acts_on_whole_stamp, mask_des_defect_practice]
          symmetrized_4fold_noise:
            label: 4-fold-symmetrized mask (M | rot90 | rot180 | rot270), then noise fill
            description: >-
              Not implemented on develop; implemented on
              feat/symmetrized-defect-fill. OR the defect mask with its 90,
              180 and 270-degree rotations about the stamp centre, zero the
              weight on the union, and noise-fill the union as noisefill does.
              This extends the DES mask symmetrization (Y1/Y3 ngmixer
              symmetrize_weight; Y6 symmetrize_masking, a single rotation) and
              cancels the column-aligned additive term that one rotation leaves
              for off-centre columns. It can quadruple the masked area, so the
              epoch cut must be applied after symmetrizing. ShapePipe stamps
              are square, so the rotations are well defined. The noise image
              needs no change.
            insights: [mask_bad_column_symmetrize, mask_des_defect_practice, mask_fixed_orientation]
          interpolate:
            label: Symmetrize, then interpolate image and noise image (DES Y6)
            description: >-
              Not implemented. Symmetrize as above, then fill the union by 2D
              Clough-Tocher interpolation (scipy) of the image and, identically,
              of the fixnoise noise image. This restores galaxy light across
              narrow defects instead of leaving a hole. It is the DES Y6 and
              Rubin metadetect practice. Poor for large holes (star masks),
              which Y6 zeroes with apodized edges.
            insights: [mask_interpolate_with_noise, mask_bad_column_symmetrize, mask_sharp_edges_ring]
          model:
            label: Symmetrize, then fill with the best-fit central model (DES Y3)
            description: >-
              Not implemented. Fill symmetrized defects with the PSF-convolved
              best-fit model of the central object from a pre-metacal fit
              (ngmix v1.3.9 replace_masked_pixels). The uberseg-only Y3 config
              adds no noise (add_noise=False); the MOF-corrector config adds
              it. This restores galaxy light; without noise it leaves
              noise-free patches that the full-stamp fixnoise noise image does
              not mirror.
            insights: [mask_bad_column_symmetrize, mask_des_defect_practice]
      blend_handling:
        label: Neighbour treatment before metacal
        rationale: >-
          This decision covers how pixels shared with a neighbour are treated,
          and only that; defect fill is the separate decision above. The two
          are coupled through BLEND_HANDLING: noisefill (the default; the
          committed config sets no key) leaves neighbours fully weighted and
          untouched, while uberseg zeroes the weight of pixels nearer a
          neighbour's coadd segmentation footprint than the target's
          (DILATE_NEIGHBOUR, default 1) and leaves the image untouched.
          Official uberseg is weight-only: esheldon/meds get_uberseg returns a
          weight map and never modifies the image (a nearest-segment-pixel
          Voronoi split). DES Y1's fiducial metacal ran on uberseg-weighted
          stamps with the raw neighbour light still in the image. The last Y3
          config does the same, though an earlier Y3 config subtracted MOF
          neighbours first. DES Y6 does not mask neighbours before the shear
          step and uses uberseg only as the weight of the fit after metacal.
          None of the DES or Rubin metacal/metadetect pipelines noise-fills the
          neighbour side. Leaving neighbour light raw is consistent with
          metacal: it is real sky, and the artificial shear shears it along
          with the target, as the real shear does. The reconvolution spreads it
          slightly further across the Voronoi boundary than the PSF already
          had. The known residual is about +2% m for uberseg-only against MOF
          subtraction in DES Y1 simulations. Separately, Sheldon et al. 2020
          find that the blending bias of per-stamp metacal is dominated by
          shear-dependent detection, which no pixel treatment fixes and which
          DES Y3 calibrated with simulations. Noise-filling the neighbour side
          would instead cut the target's own light along an unsheared
          boundary, a sharp edge that rings in the FFTs. The recommended
          comparison arm is uberseg (weight-only), with defect_fill held equal
          across arms.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::uberseg_weight;
          src/shapepipe/modules/ngmix_package/ngmix.py::prepare_ngmix_weights;
          src/shapepipe/modules/ngmix_runner.py::ngmix_runner.
        default: none
        options:
          none:
            label: No neighbour treatment (BLEND_HANDLING = noisefill)
            description: >-
              Neighbour pixels keep their full weight and image values. The fit
              sees all neighbour light in the stamp, which is the configuration
              Jarvis et al. 2016 found biased toward neighbours (worse than
              their segmentation-only mask). It is a candidate cause of the
              FLAGS=2 B-modes investigated in #814.
            insights: [mask_uberseg_neighbour_bias]
          uberseg:
            label: UberSeg, weight-only
            description: >-
              Zero the weight of pixels nearer a neighbour footprint than the
              target, as DES Y1/Y3 did. The image is untouched there, so the
              neighbour's light is sheared coherently with the target. Needs
              the coadd segmentation stamp (SEG_VIGNET_PATH). DILATE_NEIGHBOUR=1
              absorbs the coadd-vs-epoch overlay offset, because ShapePipe
              reuses one coadd seg stamp for every epoch where MEDS reprojects
              it.
            insights: [mask_uberseg_weight_only, mask_uberseg_neighbour_bias, mask_des_y1_uberseg_only, mask_blend_bias_detection]
          uberseg_fill:
            label: UberSeg plus noise fill of neighbour-side pixels
            description: >-
              Not implemented. Additionally replace the neighbour-side pixels
              with noise. This removes neighbour light from metacal, but cuts
              the target's own wings along an unsheared Voronoi boundary: a
              sharp edge (FFT ringing) that does not respond to the artificial
              shear as sky does. No published pipeline does this. Useful only as
              a diagnostic arm; a smooth (apodized) taper would be the less
              damaging variant.
            insights: [mask_sharp_edges_ring, mask_blend_bias_detection]
          mof_subtract:
            label: Subtract neighbour models, then UberSeg (DES Y1 alternative)
            description: >-
              Not implemented. Subtract multi-object-fit models of the
              neighbours from the stamp before metacal and keep uberseg
              weights. This removed the ~2% uberseg-only bias in DES Y1
              simulations, although Sheldon et al. 2020 found similar blend
              biases with and without MOF.
            insights: [mask_des_y1_uberseg_only, mask_blend_bias_detection]
      central_defect_veto:
        label: Per-epoch veto on a defect near the stamp centre
        rationale: >-
          The committed code has no veto; the option below is implemented on
          feat/symmetrized-defect-fill, not on develop. There it drops an epoch
          when any defect pixel lies within EPOCH_CENTRAL_DEFECT_RADIUS px of
          the stamp centre (0 disables), beside the masked-fraction cut in the
          epoch loop. A noise-filled hole near the centre removes the galaxy's
          core light, which no fill or symmetrization restores: on a round
          galaxy with a 0.7 arcsec PSF, single epoch, it biases m by -6.4% for
          a column 8 px from centre and -0.17% at 10 px.
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::prepare_postage_stamps.
        default: disabled
        options:
          disabled:
            label: No central veto (committed code)
          radius_10px:
            label: Drop the epoch if a defect lies within 10 px of the centre
            description: >-
              Implemented on feat/symmetrized-defect-fill, not on develop, and
              recommended there: 10 px is the smallest radius with |m| < 1% for
              both columns and single pixels.
      epoch_masked_fraction_cut:
        label: Per-epoch masked-fraction cut
        rationale: >-
          [HARDCODED] an epoch whose stamp has more than 1/3 of its
          pixels flagged (any nonzero flag bit, including the
          tile-coverage bit 2**10 set where the tile vignet is
          off-image) is dropped from the multi-epoch fit; an object
          with no surviving epoch has no shape. The cut counts flag
          pixels only, not zero-weight or invalid-RMS pixels. Before
          it, an epoch is dropped silently if its galaxy stamp is
          all zeros or its background-subtracted noise estimate
          (sigma_mad) is not positive. DES was stricter. Y1 rejected
          any epoch with a masked or zero-weight pixel, and any
          whose central 4-pixel region was masked. Y3 cut at 10% of
          raw zero-weight pixels. Y6 dropped images more than 10%
          missing and cut objects at mfrac < 0.1, which its
          simulations show avoids calibration bias. Sheldon & Huff
          2017 recommend dropping problematic epochs when many are
          available. The cut interacts with defect_fill:
          symmetrizing multiplies the masked fraction (up to fourfold), so the
          cut should be applied after symmetrizing. UNIONS has fewer
          epochs than DES, so the cost in effective number density
          has to be measured, not assumed. A defect near the centre
          is handled separately (central_defect_veto).
          Anchor: src/shapepipe/modules/ngmix_package/ngmix.py::prepare_postage_stamps.
        default: one_third
        options:
          one_third:
            label: 1/3 of the stamp flagged
            description: >-
              Drop an epoch only if more than 1/3 of the stamp pixels carry a
              nonzero flag.
          ten_percent:
            label: 10% (DES Y3 / Y6)
            description: >-
              Not implemented. Drop an epoch if more than 10% of the
              (symmetrized) stamp is masked, matching DES Y3
              max_zero_weight_frac and Y6 max_masked_fraction.
            insights: [mask_multi_epoch_drop]
          any_masked:
            label: Any masked pixel (DES Y1)
            description: >-
              Not implemented. Drop an epoch if any stamp pixel is masked, so
              that no fill is ever needed. DES could afford this with about 10
              epochs per band; UNIONS likely cannot.
            insights: [mask_multi_epoch_drop, mask_des_defect_practice]
    prior_insights:
      guinot22_ngmix_priors:
        claim: >-
          The published ngmix fit uses a Gaussian centroid prior of width one
          pixel scale, a flat prior on the half-light radius r50 in [-10, 1e6]
          arcsec and a flat flux prior in [-1e4, 1e9].
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_cen_prior
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'Gaussian distribution centred on 0 with σ = pixel scale'
            location: { page: 7 }
          - id: ev_guinot22_r50_prior
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'r50: flat distribution in'
            location: { page: 7 }
          - id: ev_guinot22_flux_prior
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'F: flat distribution in'
            location: { page: 7 }
      guinot22_hsm_initialisation:
        claim: >-
          The published fit is initialised from adaptive moments measured on
          each sheared version of the object.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_hsm_init
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'We thus run first an adaptive moments algorithm to initialise the least-square operation.'
            location: { page: 7 }
      guinot22_gaussian_model:
        claim: >-
          The published shape measurement models galaxies with a single
          Gaussian profile, arguing the resulting model bias is small and
          largely absorbed by metacalibration.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_gaussian
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'Despite being very simple, the model bias (Kacprzak et al.'
              suffix: ' 2014) is small.'
            location: { page: 7 }
      guinot22_metacal_five_images:
        claim: >-
          Metacalibration in the published analysis creates four sheared
          images for calibration plus one for measurement, with a shear step
          of 0.01 and a 90-degree-rotated noise image to cancel noise
          correlations.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_metacal
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'This method creates four images used for the calibration, and one for the measurement.'
            location: { page: 6 }
      mask_uberseg_weight_only:
        label: UberSeg is a weight-map operation (Jarvis 2016)
        claim: >-
          UberSeg, introduced for DES SV, zeroes the WEIGHT of pixels that
          belong to another object's coadd segmentation footprint or lie
          closer to another object than to the target; MEDS weights are also
          zeroed wherever a mask flag is set. The image is not modified: in
          the forward-model fits it was designed for, a zero-weight pixel
          drops out of the likelihood exactly. esheldon/meds get_uberseg
          matches, which returns a weight map.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1507.05603
            version: 3
            quote:
              exact: We then set pixels in the weight map to zero if they were either associated with other objects in the segmentation map or were closer to any other object than to the object of interest.
          - id: ev2
            doi: 10.48550/arXiv.1507.05603
            version: 3
            quote:
              exact: are both of the model-fitting variety
      mask_uberseg_neighbour_bias:
        label: Neighbour light biases shapes toward neighbours (Jarvis 2016)
        claim: >-
          With a plain segmentation-map mask, light from a bright neighbour
          just outside its footprint entered the fit and biased the shape
          toward the neighbour; UberSeg made that bias undetectable in
          end-to-end simulations. ShapePipe's default (no neighbour treatment)
          masks less than even the plain segmentation map.
        created_at: "2026-09-26T00:00:00Z"
        derived: false
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1507.05603
            version: 3
            quote:
              exact: when using ordinary segmentation maps we found a significant bias of the galaxy shape in the direction toward neighbors.
          - id: ev2
            doi: 10.48550/arXiv.1507.05603
            version: 3
            quote:
              exact: we no longer detected any systematic bias in the shape estimates due to unmasked flux from neighboring objects
      mask_metacal_acts_on_whole_stamp:
        label: Metacal transforms every stamp pixel, weights unseen
        claim: >-
          Metacal builds an interpolated image of the whole postage stamp,
          deconvolves, shears and reconvolves it; its Fourier transforms
          cannot accommodate missing data. So the image values of zero-weight
          pixels feed the sheared images. The method papers leave masking
          unaddressed. ngmix implements exactly this: an InterpolatedImage of
          obs.image, with the weights copied through.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1702.02600
            version: 1
            quote:
              exact: For each galaxy and PSF postage stamp, we first create an
          - id: ev2
            doi: 10.48550/arXiv.1702.02600
            version: 1
            quote:
              exact: We have made no attempt to deal with the effects of masked pixels or blending
          - id: ev3
            doi: 10.48550/arXiv.1702.02601
            version: 2
            quote:
              exact: convolutions cannot accommodate missing data
      mask_bad_column_symmetrize:
        label: Filled bad columns give additive e1; symmetrize the mask
        claim: >-
          Sheldon & Huff 2017 found that filling bad columns (with the
          best-fit model, not even noise) gave a large additive e1 bias and a
          few-per-mille multiplicative bias. Both vanished when a compensating
          column rotated by 90 degrees about the stamp centre was added.
          Sheldon et al. 2020 recommend the same compensating mask, and DES Y6
          OR-s each bad-pixel mask with its 90-degree rotation, as previous
          DES pipelines did, to cancel additive biases.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1702.02601
            version: 2
            quote:
              exact: as well as a multiplicative bias of a few parts in a thousand
          - id: ev2
            doi: 10.48550/arXiv.1702.02601
            version: 2
            quote:
              exact: at 90 degree rotation about the center of the image, restoring symmetry to the image
          - id: ev3
            doi: 10.48550/arXiv.1911.02505
            version: 2
            quote:
              exact: An additional compensating mask, rotated at right angles to the real mask, can be used to restore symmetry to the image
          - id: ev4
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: we rotate the bad pixel mask by 90 degrees and apply it via a logical
          - id: ev5
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: This process helps to cancel additive biases in the final shape measurement.
      mask_des_defect_practice:
        label: DES never passed raw defects through metacal
        claim: >-
          Every DES metacal generation removed defects from the image before
          metacal: Y1 dropped any epoch with a masked pixel, Y3 filled
          symmetrized defects with the best-fit central model (ngmix-y1-config
          / ngmix-y3-config, see the defect_fill rationale), and Y6
          interpolated symmetrized defects following "previous DES shear
          measurement pipelines". None left raw defect values in a zero-weight
          pixel, which is what ShapePipe's uberseg path does today.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: Following previous DES shear measurement pipelines
          - id: ev2
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: Then, we apply a two-dimensional Clough-Tocher interpolation
      mask_interpolate_with_noise:
        label: Interpolate defects, and the noise image identically
        claim: >-
          The metadetect papers interpolate masked regions (bad columns,
          cosmic rays, saturation) before the shear step, taking care not to
          create a spurious shear, and pass the noise image used for metacal's
          correlated-noise correction through the same interpolation.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1911.02505
            version: 2
            quote:
              exact: The FFT does not permit missing data, so the masked regions must be interpolated in some way.
          - id: ev2
            doi: 10.48550/arXiv.1911.02505
            version: 2
            quote:
              exact: so the noise field used for correcting correlated noise effects must also be propagated through the same coadding and interpolation
          - id: ev3
            doi: 10.48550/arXiv.2303.03947
            version: 2
            quote:
              exact: Before warping, we interpolated the simulated artifacts in each image such as cosmic rays, bad columns, and saturated pixels.
          - id: ev4
            doi: 10.48550/arXiv.2303.03947
            version: 2
            quote:
              exact: we must also run the noise image through the same procedures
      mask_sharp_edges_ring:
        label: Sharp mask edges ring through metacal; apodize large masks
        claim: >-
          Masks with sharp edges cause ringing in the metacal FFTs, so
          bright-star regions are set to zero with an apodized (smoothly
          tapered) edge, and the noise image gets the same masking. The same
          reasoning argues against a hard noise fill cut along a neighbour's
          Voronoi boundary.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.2303.03947
            version: 2
            quote:
              exact: Masks with sharp features can cause ringing in the FFTs used by the
          - id: ev2
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: we further mask bright stars with apodization to avoid FFT artifacts during the deconvolution, shearing, and reconvolution processes
          - id: ev3
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: we also applied the same masking and apodization to the
      mask_multi_epoch_drop:
        label: Drop heavily masked epochs (10% in DES)
        claim: >-
          With many dithered epochs, problematic data can simply be dropped
          (Sheldon & Huff 2017). DES Y6 drops input images more than 10%
          missing and cuts objects at masked fraction mfrac < 0.1, which its
          image simulations show is enough to avoid shear calibration bias.
          ShapePipe's cut is 1/3.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1702.02601
            version: 2
            quote:
              exact: data deemed problematic can simply be left out of the fit
          - id: ev2
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: Images with a missing pixel fraction higher than 10
          - id: ev3
            doi: 10.48550/arXiv.2501.05665
            version: 2
            quote:
              exact: is sufficient not to introduce shear calibration biases
      mask_des_y1_uberseg_only:
        label: 'DES Y1 metacal: uberseg-only fiducial, ~2% m residual'
        claim: >-
          DES Y1 metacal's fiducial catalogue handled neighbours with uberseg
          only (raw neighbour light in the image). In dense deblending
          simulations it carried m of about +2% (2.18 +/- 0.16 per cent at S/N
          > 10), removed by subtracting MOF models of the neighbours. In data
          the relative uberseg-vs-MOF m was 0.023 +/- 0.009.
        created_at: "2026-09-26T00:00:00Z"
        derived: false
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1708.01533
            version: 2
            quote:
              exact: masks pixels close to neighbours rather than assigning a fraction of the light in each pixel to them
          - id: ev2
            doi: 10.48550/arXiv.1708.01533
            version: 2
            quote:
              exact: We detect no bias when subtracting the light from neighbours.
      mask_blend_bias_detection:
        label: Stamp-metacal blend bias is mostly shear-dependent detection
        claim: >-
          Sheldon et al. 2020 find that the few-percent blending bias of
          per-stamp metacal comes from shear-dependent detection, not from
          blended light itself: it is similar with and without neighbour
          subtraction, and in metacal the space between objects is sheared
          coherently. DES Y3 kept Y1's approach (Gatti et al. list no change
          to neighbour or mask handling) and calibrated the resulting 2-3%
          with image simulations.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1911.02505
            version: 2
            quote:
              exact: We show that this bias is not due to blending itself, but rather to shear-dependent object detection.
          - id: ev2
            doi: 10.48550/arXiv.1911.02505
            version: 2
            quote:
              exact: we see similar biases when no deblending is performed
          - id: ev3
            doi: 10.48550/arXiv.1911.02505
            version: 2
            quote:
              exact: the space between objects is sheared coherently
          - id: ev4
            doi: 10.48550/arXiv.2011.03408
            version: 3
            quote:
              exact: shape catalogue differs from DES Y1 in the following ways
          - id: ev5
            doi: 10.48550/arXiv.2011.03408
            version: 3
            quote:
              exact: which affects the shear estimates when objects are blended
      mask_fixed_orientation:
        label: Fixed-orientation cameras make mask anisotropy coherent
        claim: >-
          Masks have a preferred direction (columns, bleeds, spikes). On a
          camera with a fixed sky orientation (DECam, and CFHT/MegaCam on its
          equatorial mount), mask-induced shape errors therefore add up
          coherently; with Rubin's camera rotation, unmasked trails averaged
          away. DES Y3 has an unexplained mean e1 of 3.5e-4 that its
          simulations, which include the real bad-pixel masks, do not
          reproduce; whether masks cause it is not established.
        created_at: "2026-09-26T00:00:00Z"
        derived: true
        evidence:
          - id: ev1
            doi: 10.48550/arXiv.1708.01533
            version: 2
            quote:
              exact: The DES focal plane does not rotate, so these effects always correspond to the same orientation in sky coordinates.
          - id: ev2
            doi: 10.48550/arXiv.2303.03947
            version: 2
            quote:
              exact: We find that these unmasked trails do not cause a shear bias, which we attribute to the camera rotations that randomize the direction of the trail on the sky.
          - id: ev3
            doi: 10.48550/arXiv.2011.03408
            version: 3
            quote:
              exact: Our shear catalogue is characterized by a non-null mean shear in one of the two components, whose origin is unknown.

  # ═════════════════════════════════════════════════════════════════════════
  catalogue_assembly:
    description: >-
      The per-tile science catalogue: shape chunks merged and joined to the
      detection catalogue and PSF quantities.
    inputs:
      - id: ngmix_chunks
        type: data
        source: per-tile ngmix catalogue chunks + tile sexcat + PSF diagnostics
    outputs:
      - id: tile_final_cat
        type: data
        format: fits
        description: The assembled per-tile science catalogue (final_cat family).
        inputs: [ngmix_chunks]
        decisions:
          [star_galaxy_classification, tile_overlap_handling,
           failure_sentinels]
    decisions:
      star_galaxy_classification:
        label: Star/galaxy separation deferred out of the pipeline
        rationale: >-
          SM_DO_CLASSIFICATION=False and no spread-model input is
          wired, so the catalogue ships every object and separation
          happens downstream. The dormant make_cat classifier uses
          class = sm + 2 sm_err with stars at |class| <
          SM_STAR_THRESH and galaxies at class > SM_GAL_THRESH, read
          from config when classification is on; the function
          defaults are 0.003 and 0.01, and the committed config sets
          neither key, so enabling classification alone raises.
          Guinot+22 selected galaxies in the pipeline at s + 2
          sigma_s > 0.0003 together with s > 0 and 20 < MAG_AUTO <
          26; the dormant code implements only the spread-model
          test.
          Anchor: workflow/config/cfis/config_tile_Mc.ini#MAKE_CAT_RUNNER.SM_DO_CLASSIFICATION = False;
          src/shapepipe/modules/make_cat_runner.py::make_cat_runner;
          src/shapepipe/modules/make_cat_package/make_cat.py::save_sm_data;
          workflow/config/cfis/final_cat.param#SPREAD_CLASS.
        default: deferred_downstream
        options:
          deferred_downstream:
            label: No in-pipeline classification; catalogue ships all objects
          spread_model_inline:
            label: spread_model classification in make_cat
            insights: [guinot22_spread_model_cut]
            description: >-
              Not wired in the workflow; needs spread_model_runner after the
              PSF interpolation, its output added to make_cat's inputs, and
              SM_STAR_THRESH / SM_GAL_THRESH set.
      tile_overlap_handling:
        label: Tile-overlap duplicates neither removed nor flagged
        rationale: >-
          Adjacent tiles overlap, and objects in the overlap are
          measured in both. [HARDCODED] make_cat attaches only
          TILE_ID; there is no unique-object rule and no overlap
          flag, so duplicates are left to downstream selection.
          [LINT] the make_cat package docstring documents a
          TILE_LIST key that flags overlap objects; nothing
          implements it.
          Anchor: src/shapepipe/modules/make_cat_package/make_cat.py::save_sextractor_data;
          src/shapepipe/modules/make_cat_package/__init__.py.
        default: no_dedup_in_pipeline
        options:
          no_dedup_in_pipeline:
            label: Ship duplicates; TILE_ID is the only handle
          overlap_flagging:
            label: Flag overlap objects in the catalogue
            description: Not implemented.
          nearest_tile_centre:
            label: Keep each object only in its nearest tile
            excluded: true
            excluded_reason: >-
              Requires cross-tile coordination at assembly time, which the
              per-tile DAG deliberately avoids.
      failure_sentinels:
        label: Objects without shape measurements kept, with sentinel values
        rationale: >-
          [HARDCODED] detections with no ngmix row (no surviving
          epoch, or an exception during the fit) stay in the
          catalogue with sentinels: sizes, fluxes, magnitudes and
          flags 0, flux and magnitude errors -1, ellipticities and
          their errors -10, size errors 1e30, and NGMIX_N_EPOCH 0.
          The sentinels define what a downstream cut must exclude: a
          failed object's NGMIX_MCAL_FLAGS reads 0, the success
          value, so a cut on flags alone keeps it; a cut on
          NGMIX_N_EPOCH > 0 removes it.
          Anchor: src/shapepipe/modules/make_cat_package/make_cat.py::SaveCatalogue._save_ngmix_data.
        default: sentinel_values
        options:
          sentinel_values:
            label: Keep with sentinels (flags 0, e -10, T_ERR 1e30)
          drop_unmatched:
            label: Drop objects without shapes
            excluded: true
            excluded_reason: >-
              Loses the photometry-only population and hides attrition.
    prior_insights:
      guinot22_spread_model_cut:
        claim: >-
          The published analysis selects galaxies inside the pipeline with the
          spread model, at s + 2 sigma_s > 0.0003 together with s > 0 and
          20 < MAG_AUTO < 26.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_spread_model
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'We then use the spread model to make the selection presented below:'
            location: { page: 5 }
          - id: ev_guinot22_spread_model_cut
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 's + 2σs > 0.0003'
            location: { page: 5 }
