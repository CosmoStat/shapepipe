# ASTRA record for ShapePipe: the scientific decisions embedded in the code and
# the committed configs, with their reasoning and the alternatives that were
# rejected. It is the place scientific decisions are written down — see the
# "Scientific decisions" section of CLAUDE.md for when and how to amend it.
#
# The record describes the pipeline as orchestrated by workflow/Snakefile
# (PRD CosmoStat/shapepipe#848, PR #852). Conventions:
#
#   * Decisions anchor to code, not recipes. Every rationale ends with one
#     sentence "Anchor: <ref>; <ref>; ..." in a strict, greppable grammar.
#     Each ref is a path relative to the shapepipe repo root, in one of three
#     forms: CODE `path::symbol`, CONFIG `path#SECTION.KEY` (or `path#KEY` for
#     sectionless .sex/.psfex/.ww/.param files), FILE `path` for a whole file
#     or package. No line numbers — they rot; a line-level fact names its
#     enclosing symbol. The analysis-ASTRA rule "never hardcode; reference via
#     {decisions.x}" cannot hold in a codebase — the committed configs ARE the
#     values. [HARDCODED] marks a scientific value living in code with no
#     config exposure: the silent defaults the record exists to surface.
#   * The default universe IS the committed configuration (universes/committed).
#     Alternatives are excluded-with-reasons or genuinely open forks.
#   * Sub-analyses follow the pipeline's methodological units — masking,
#     detection, preparation, star selection + PSF, shape measurement, PSF
#     diagnostics, survey geometry, catalogue assembly — not its ~20 Snakemake
#     rules. Cross-cutting decisions stay top-level. A prior_insight repeated
#     inside a sub-analysis carries a `_local` suffix: ids are scoped, and the
#     duplicate keeps the sub-analysis readable on its own.
#   * Outputs are representative product FAMILIES (one final_cat per tile),
#     not enumerable artifacts; no recipes — the executor is the Snakemake
#     workflow.
#   * [LINT] marks places where this record and the code already disagree, or
#     where the code disagrees with itself — found while authoring this file.
#   * [PENDING #NNN] marks state that is live on feat/snakemake-orchestration
#     — and therefore in smk-g4, the 34-tile validation campaign run under
#     this branch — but not yet merged to develop. The record follows the
#     branch and names the open PR.
#   * A `path#KEY` anchor names the key's position in the file, not its
#     activation: where the decision is "this is deliberately off", the key
#     it points at may be commented out (e.g. final_cat.param#SPREAD_CLASS).

version: "0.0.14"
name: ShapePipe scientific decisions
description: >-
  Codebase-level decision record for the ShapePipe weak-lensing pipeline
  (UNIONS/CFIS). Membership test: "a different defensible choice would change
  which objects enter the shear catalogue, or the numbers attached to them."
  Workflow mechanics that reproduce identical numbers (manifest sentinels,
  clean-cascade cut, directory() outputs, allocation strategy, chunking under
  position seeding) are deliberately absent; they live in the PRD and code.
tags: [shapepipe, weak-lensing, unions, codebase-record]
container: shapepipe-develop-runtime.sif

inputs:
  - id: tile_images
    type: data
    source: CADC-staged CFIS/UNIONS r-band tile stacks + exposure triplets (workflow/config.yaml)
    description: >-
      Pre-staged P3 tiles and single-exposure image/weight/flag triplets on
      /project; get_images runs with RETRIEVE=symlink against this store.
  - id: gsc_star_catalogue
    type: data
    source: GSC 2.3 (Vizier I/305/out) cone queries — scripts/python/create_star_cat.py
    description: >-
      Reference star catalogue driving bright-star masking. Catalogue choice,
      query geometry, and magnitude handling are decisions in the masking
      sub-analysis.

outputs:
  - id: final_cat
    type: data
    format: fits
    description: >-
      Per-tile shear catalogue family, the terminal science product (one per
      campaign tile; make_cat_runner). Column selection and failure sentinels
      are decisions in catalogue_assembly.
    inputs: [tile_images]
    decisions: [per_unit_count_floor, postage_stamp_size, photometric_zeropoint]

decisions:

  # ── cross-cutting ────────────────────────────────────────────────────────

  per_unit_count_floor:
    label: Per-unit completeness policy under partial failure
    rationale: >-
      A 40-CCD stage where some CCDs legitimately produce nothing (sparse CCD,
      setools rejects everything) cannot be all-or-nothing. The field's
      converged answer (DES PSF blacklist, Rubin quantum registry) is per-unit
      outcome records gated on a quality floor: record the attrition, fail
      loud only below the floor, continue the survey. The floor VALUES are the
      scientific content — how much silent per-CCD attrition can enter the
      catalogue. The COMPLETENESS table holds them (exp_split
      expect=121/floor=41, exp_mask expect=40/floor=1, psfex expect=80/floor=2,
      psfex_interp floor=0 warn-only). Related leak the floor does not cover:
      merge_sep_cats warns-and-skips a missing ngmix chunk, silently shrinking
      a tile's shape catalogue below the floor's radar; and make_cat's own 10%
      size-shortfall guard is commented out (see
      catalogue_assembly.shape_catalogue_shortfall_guard).
      Anchor: workflow/scripts/completeness.py::COMPLETENESS;
      src/shapepipe/modules/merge_sep_cats_package/merge_sep_cats.py::MergeSep.process.
    default: count_floor
    options:
      count_floor:
        label: Count-floor table (expect/floor per runner; fail below floor)
        insights: [des_psf_blacklist, guinot22_star_floor_22]
      all_or_nothing:
        label: Every expected sub-product required
        excluded: true
        excluded_reason: >-
          Legitimately-absent CCDs would fail whole exposures and poison their
          downstream cone; Snakemake has no optional-output primitive; field
          precedent is tolerated, recorded attrition.
      no_floor:
        label: Accept whatever is produced, no gate
        excluded: true
        excluded_reason: >-
          Silent attrition — a stage producing 2 of 40 CCDs would flow into
          the catalogue unremarked.

  postage_stamp_size:
    label: Postage-stamp size, 51 px everywhere
    rationale: >-
      One number pins three coupled apertures: the SExtractor vignet cut
      around each detection (VIGNET(51,51) in default_noimaflags.param /
      default.param, VIGNET_SIZE=51 in the dormant external-catalogue path,
      example/cfis/config_tile_Uc.ini), the vignetmaker
      stamps that feed ngmix (STAMP_SIZE=51 in config_tile_PiViVi.ini, both
      runs; nearest-pixel centring, no sub-pixel interpolation in
      VignetMaker._get_stamp), and the PSFEx model stamp (PSF_SIZE 51,51 in
      default.psfex). The stamp IS the pixel data ngmix fits: it bounds
      measurable galaxy size and truncates the wings of large galaxies.
      Rationale for 51 not recorded in code.
      Anchor: workflow/config/cfis/default_noimaflags.param#VIGNET;
      example/cfis/config_tile_Uc.ini#READ_EXT_SEXCAT_RUNNER.VIGNET_SIZE;
      workflow/config/cfis/config_tile_PiViVi.ini#VIGNETMAKER_RUNNER_RUN_1.STAMP_SIZE;
      workflow/config/cfis/default.psfex#PSF_SIZE;
      src/shapepipe/modules/vignetmaker_package/vignetmaker.py::VignetMaker._get_stamp.
    default: px_51
    options:
      px_51:
        label: 51x51 px (~9.5 arcsec at 0.187"/px)
      larger_adaptive:
        label: Larger or size-adaptive stamps
        excluded: true
        excluded_reason: >-
          Not wired; would need coupled changes in three places (a change in
          any one alone desynchronises galaxy stamp, PSF stamp, and vignet).

  photometric_zeropoint:
    label: Magnitude zero-point convention, fixed 30.0 on tiles
    rationale: >-
      Tiles use a hard-coded MAG_ZEROPOINT 30.0 for every tile
      (default_tile.sex; ZP_FROM_HEADER=False in config_tile_Sx.ini), and
      ngmix repeats it (MAG_ZP=30.0 in config_tile_Ng_template.ini).
      Exposures instead read the per-image header zero-point
      (ZP_FROM_HEADER=True, ZP_KEY=PHOTZP in config_exp_psfex.ini). The tile
      convention leans on MegaPipe's calibrated stacks; the star-selection
      magnitude window (18-22) and mask magnitude limits inherit whichever
      convention their stage uses. SExtractorCaller.get_zero_point is the
      header-reading path, unused on tiles.
      Anchor: workflow/config/cfis/default_tile.sex#MAG_ZEROPOINT;
      workflow/config/cfis/config_tile_Sx.ini#SEXTRACTOR_RUNNER.ZP_FROM_HEADER;
      workflow/config/cfis/config_tile_Ng_template.ini#NGMIX_RUNNER.MAG_ZP;
      workflow/config/cfis/config_exp_psfex.ini#SEXTRACTOR_RUNNER.ZP_KEY;
      src/shapepipe/modules/sextractor_package/sextractor_script.py::SExtractorCaller.get_zero_point.
    default: fixed_30_tiles_header_exposures
    options:
      fixed_30_tiles_header_exposures:
        label: Tiles fixed 30.0; exposures from header PHOTZP
      header_everywhere:
        label: Per-image header zero-points on tiles too
        excluded: true
        excluded_reason: >-
          MegaPipe stacks are calibrated to ZP 30 by construction; per-tile
          header reads add a failure path for no expected numerical change.
          (If that claim is wrong, this is a real fork — verify.)

  baseline_validation_criterion:
    label: Validation criterion against the v2.0 bash baseline
    rationale: >-
      Because shape_measurement.ngmix_seed_mode deliberately changes noise
      streams, P1 validation against v2.0 is statistical parity
      (population-level agreement), not bit parity. Everything upstream of
      ngmix (through PSFEx) validated bit-exactly (P0: 4/4 PASS). This
      defines the evidence standard for "the same pipeline" — surfaced to the
      collaboration as open Q5 in PRD #848.
      [PENDING #873] Run-to-run determinism, which is a different property
      from parity with v2.0, is now complete. With the setools star split
      seeded (star_selection_psf.psf_train_validation_split) the last unseeded
      draw in the science chain is gone: two runs of this code over the same
      inputs now produce the same PSF star sample, the same PSF models and
      the same shapes, which they did not before. That also settles a tension
      this record carried — the bit-parity claim above sat next to an
      unseeded star split that could not have been bit-reproducible, and the
      P0 exposure-stage comparison did see PSF-validation CCD attrition
      differ between the two sides. Statistical rather than bit parity is
      therefore demanded only against the v2.0 baseline, not between runs of
      the current pipeline.
      Anchor: workflow/config/cfis/config_tile_Ng_template.ini#NGMIX_RUNNER.SEED_FROM_POSITION;
      src/shapepipe/modules/ngmix_package/ngmix.py::position_seed;
      src/shapepipe/modules/setools_package/setools.py::SETools._make_rand_split.
    default: statistical_parity
    options:
      statistical_parity:
        label: Population-level agreement in shear observables
      bit_parity:
        label: Bit-identical catalogues
        excluded: true
        excluded_reason: >-
          Impossible by construction once the seed mode changed; requiring it
          would freeze the chunk-dependent v2.0 RNG forever.

prior_insights:
  des_psf_blacklist:
    claim: >-
      DES enters a CCD's PSF model into a blacklist rather than failing the
      exposure - in Y3, any CCD with fewer than 25 stars surviving outlier
      rejection is blacklisted and excluded downstream (~2% of data removed),
      and processing proceeds.
    created_at: "2026-07-16T00:00:00Z"
    evidence:
      - id: ev_jarvis_y3
        doi: "10.48550/arXiv.2011.03409"
        quote:
          exact: "we enter it into a"
          suffix: " \u201cblacklist\u201d and exclude this CCD"
        location: { page: 10 }
  guinot22_star_floor_22:
    claim: >-
      The published ShapePipe/UNIONS analysis applies a per-CCD quality floor
      rather than failing whole exposures: a CCD with fewer than 22 selected
      stars is discarded for PSF estimation and contributes no epoch to the
      shape measurement, while processing continues.
    created_at: "2022-04-01T00:00:00Z"
    evidence:
      - id: ev_guinot22_star_floor
        doi: "10.48550/arXiv.2204.04798"
        quote:
          exact: 'The dashed line represents the cut at 22 stars/CCD below which the CCD is discarded for the PSF estimation.'
        location: { page: 4 }

findings:
  orchestration_parity:
    claim: >-
      The Snakemake orchestration reproduces the bash baseline bit-exactly
      through PSFEx (P0 validation, 4/4 PASS on the 186/187 quad).
      Read it with two caveats. It is a statement about the pre-#873 code:
      both #873 changes move products (a different realised star split, a
      stricter science-path star gate), so re-establishing parity would mean
      regenerating the baseline under the current branch. And the parity is
      bit-exact in the products compared, not everywhere: the P0
      exposure-stage comparison did see PSF-validation CCD attrition differ
      between the two sides, which the then-unseeded star split explains
      (see baseline_validation_criterion).
    created_at: "2026-08-19T00:00:00Z"
    evidence:
      - id: ev_final_cat
        artifact: final_cat
  record_authoring_found_defects:
    claim: >-
      Nine places in the code disagree with themselves or with their
      documentation, each carried as a [LINT] mark: the 22-vs-20
      STAR_THRESH mismatch between PSF validation and science interpolation;
      the unseeded train/validation rand_split (setools.py:664 — the star
      sample entering the PSF model is irreproducible run-to-run); additive
      (non-bitwise) mask-plane combination, safe today only because the
      committed flag values are disjoint; the dead MESSIER_PIXEL_SCALE config
      key; final_cat.param requesting IMAFLAGS_ISO that the merged catalogue
      never receives; the centroid_source default disagreement (runner "wcs"
      vs module "hsm", latent for direct callers); setools logging a FWHM cut
      (mode +- 0.1 px in arcsec) half the applied one (mode +- 0.2 px), and
      mixing pixel scales 0.187/0.186 within one file; TILE_LIST
      overlap-flagging documented but never implemented; the mccd_plots
      module docstring advertising rho statistics that live downstream now.
      Status: the first two are fixed. CosmoStat/shapepipe#873 seeds the
      rand_split and raises the science-path STAR_THRESH to 22, and commit
      90782098 mirrors that threshold into the workflow's own committed
      config fork. #873 is OPEN against develop; both fixes are live on
      feat/snakemake-orchestration only, and the 34-tile smk-g4 campaign is
      the first run under them. The other seven stand, including the
      mccd_plots docstring that still advertises rho statistics the package
      no longer computes.
    created_at: "2026-08-29T00:00:00Z"
    derived: true
    evidence:
      - id: ev_final_cat_defects
        artifact: final_cat
  code_paper_divergence:
    claim: >-
      The two ShapePipe papers state roughly 17 of this record's 50 decisions
      (now carried as prior_insights with verbatim quotes), have drifted from
      the code on 10 of them since publication, and are silent on the rest.
      Among them: DETECT_MINAREA 10 -> 5; DEBLEND_MINCONT 0.001 ->
      0.0005 on tiles; tile background AUTO -> MANUAL 0; in-line spread-model
      star/galaxy classification -> disabled and deferred downstream; HSM
      moment initialisation -> WCS centroids and prior-based guesses; GSC 2.2
      via cdsclient -> GSC 2.3 via astroquery; PSF acceptance 22 stars/CCD
      published for the science path vs 20 committed there — closed since by
      #873 + 90782098, which put the science path on 22, so nine of the ten
      drifts remain open on the orchestration branch.
    created_at: "2026-08-29T00:00:00Z"
    derived: true
    evidence:
      - id: ev_final_cat_divergence
        artifact: final_cat

analyses:

  # ═════════════════════════════════════════════════════════════════════════
  masking:
    description: >-
      Which pixels are excluded before anything is measured. Modules:
      src/shapepipe/modules/mask_package/mask.py (halo/spike/DSO/border
      builders, WeightWatcher driver), scripts/python/create_star_cat.py
      (star-catalogue fetch), configs config_exp_Ma.ini +
      config_onthefly.mask / config_tile_onthefly.mask + mask_default/.
      [LINT] MESSIER_PIXEL_SCALE is set in config_tile_onthefly.mask but
      never read — mask_dso takes pixel scale from the WCS. [LINT]
      _build_final_mask combines mask planes by ADDITION (mask.py:1141+),
      not bitwise OR; the committed flag values (2/4/16/32/128) are disjoint
      so no live collision exists, but any future duplicate value corrupts
      the flag semantics silently. (FLAG_OUTFLAGS 2 in default.ww is inert:
      no input flag image is passed to WeightWatcher — mask.py:1047-1074.)
    inputs:
      - id: ccd_images
        type: data
        source: split per-CCD exposure images + weights + CFIS flag maps (exp_split family)
      - id: star_catalogue
        type: data
        source: GSC 2.3 per-exposure catalogues (exp_star_cat cache)
    outputs:
      - id: exposure_mask
        type: data
        format: fits
        description: Per-CCD pipeline flag maps (run_sp_exp_Ma family).
        decisions:
          [star_catalogue_query, star_magnitude_definition,
           bright_star_mask_geometry, deep_sky_object_masking,
           border_mask_width, pixel_threshold_flags, external_flag_usage]
    decisions:
      star_catalogue_query:
        label: Reference star catalogue and query for bright-star masking
        rationale: >-
          GSC 2.3 (Vizier I/305/out), columns GSC2.3/RAJ2000/DEJ2000/Fmag/
          jmag/Vmag/Nmag/Class, cone radius covering the full CCD mosaic, no
          magnitude cut at query time. GSC 2.2 rejected in a code comment
          beside the catalogue ID ("does not have Fmag").
          Provenance hazard: the star-cat cache is not keyed by script
          version — a semantic change to this query reruns the rule but takes
          the skip-if-exists branch; clear the cache by hand for the change
          to reach the data (workflow/config.yaml star_cats comment).
          Query geometry: search radius = half the image diagonal about the
          field centre (Mask._get_image_radius); source precedence: with
          CDSCLIENT_PATH set in the .mask configs the online-query branch
          wins unless an external star cat is passed (USE_EXT_STAR=True in
          config_exp_Ma.ini routes the exp_star_cat cache in).
          Published description (Farrens+22 p.2): cdsclient downloads GSC 2.2
          (with cdsclient 3.84 pinned in its Table A.1); current code: GSC 2.3
          queried through astroquery — two things drifted, the catalogue
          version (Fmag is needed for the magnitude cut) and the query
          transport, since cdsclient is never invoked yet survives as a
          required-but-unused CDSCLIENT_PATH still set to the stale
          findgsc2.2 in config_tile_onthefly.mask.
          Anchor: scripts/python/create_star_cat.py::CDS_CAT_ID;
          src/shapepipe/modules/mask_package/mask.py::Mask._CDS_cat_ID;
          src/shapepipe/modules/mask_package/mask.py::Mask._cds_keys;
          workflow/config.yaml.
        default: gsc_23_vizier
        options:
          gsc_23_vizier:
            label: GSC 2.3 cone queries, all bands, no query-time mag cut
            insights: [farrens22_star_cat_on_disk]
          gaia:
            label: Gaia-based star catalogue
            excluded: true
            excluded_reason: >-
              Not wired. Deeper and better photometry; switching changes mask
              geometry and hence the selection function — a real DR-level fork.
      star_magnitude_definition:
        label: Per-star magnitude for mask scaling
        rationale: >-
          mag = unweighted mean of the finite GSC bands among F, j, V, N;
          stars with no finite band are logged and not masked; only Class==0
          objects masked. Comment records why not a naive mean: NaN bands
          would NaN-poison the mag < mag_limit test, leaving exactly the
          bright stars with incomplete photometry unmasked.
          Anchor: src/shapepipe/modules/mask_package/mask.py::Mask._create_mask.
        default: mean_finite_bands
        options:
          mean_finite_bands: { label: Mean of finite F/j/V/N; Class==0 only }
          single_band:
            label: Single-band (Fmag) magnitude
            excluded: true
            excluded_reason: Drops stars with missing Fmag from masking entirely.
      bright_star_mask_geometry:
        label: Halo + diffraction-spike mask geometry and magnitude scaling
        rationale: >-
          DS9 polygon templates scaled linearly with magnitude about a pivot:
          halo HALO_MAG_LIM=13, HALO_SCALE_FACTOR=0.05, HALO_MAG_PIVOT=13.8
          (halo_mask.reg, ~270 px); spike SPIKE_MAG_LIM=18,
          SPIKE_SCALE_FACTOR=0.3, SPIKE_MAG_PIVOT=13.8
          (MEGAPRIME_star_i_13.8.reg); scaling = 1 - factor*(mag-pivot),
          floored at 0.1 by Mask._scaling_min.
          Identical in exposure and tile configs. Template filename encodes
          provenance (MegaPrime i-band mag-13.8 star); numeric rationale not
          recorded. Note the 5-mag gap: stars in 13-18 get spikes but no halo.
          Anchor: workflow/config/cfis/config_onthefly.mask#HALO_PARAMETERS.HALO_MAG_LIM;
          workflow/config/cfis/config_onthefly.mask#SPIKE_PARAMETERS.SPIKE_MAG_LIM;
          workflow/config/cfis/mask_default/halo_mask.reg;
          workflow/config/cfis/mask_default/MEGAPRIME_star_i_13.8.reg;
          src/shapepipe/modules/mask_package/mask.py::Mask._create_mask;
          src/shapepipe/modules/mask_package/mask.py::Mask._scaling_min.
        default: megaprime_polygon_linear_scaling
        options:
          megaprime_polygon_linear_scaling:
            label: Fixed MegaPrime templates, linear mag scaling, floor 0.1
          radial_profile_fit:
            label: Per-star radial-profile-driven mask size
            excluded: true
            excluded_reason: Not wired; the survey precedent is template-based.
      deep_sky_object_masking:
        label: Messier + NGC objects masked as circles, no enlargement
        rationale: >-
          Circles of radius max(size_X, size_Y), MESSIER_SIZE_PLUS=0,
          NGC_SIZE_PLUS=0 (function default is 0.1 — the 0 is a choice);
          flags 16/32. A comment records the overlap-test fix (corner-only
          test missed small interior objects).
          Anchor: workflow/config/cfis/config_onthefly.mask#MESSIER_PARAMETERS.MESSIER_SIZE_PLUS;
          workflow/config/cfis/config_tile_onthefly.mask#NGC_PARAMETERS.NGC_SIZE_PLUS;
          src/shapepipe/modules/mask_package/mask.py::Mask.mask_dso.
        default: circles_no_padding
        options:
          circles_no_padding:
            label: "size_plus = 0: mask exactly the catalogued extent"
            insights: [farrens22_messier_mask]
          padded_circles:
            label: size_plus > 0 (code default 0.1)
            excluded: true
            excluded_reason: >-
              Rationale for dropping the padding not recorded; flagged as a
              question rather than an endorsed exclusion.
      border_mask_width:
        label: CCD border mask, 50 px on exposures, none on tiles
        rationale: >-
          Exposures BORDER_WIDTH=50 (flag 4); tiles BORDER_MAKE=False.
          Mask.mask_border's own default is 100 — the committed 50 is a
          choice, unrecorded. Trims CCD edges where PSF and astrometry
          degrade; changes the effective footprint.
          Anchor: workflow/config/cfis/config_onthefly.mask#BORDER_PARAMETERS.BORDER_WIDTH;
          workflow/config/cfis/config_tile_onthefly.mask#BORDER_PARAMETERS.BORDER_MAKE;
          src/shapepipe/modules/mask_package/mask.py::Mask.mask_border.
        default: px50_exposures_only
        options:
          px50_exposures_only:
            label: 50 px exposure borders; tiles unmasked
            insights: [farrens22_border_mask]
          px100:
            label: 100 px (module default)
            excluded: true
            excluded_reason: Halves usable edge area for no recorded gain.
      pixel_threshold_flags:
        label: WeightWatcher weight/flag thresholds into mask bits
        rationale: >-
          WEIGHT_MIN 0, WEIGHT_MAX 1000, WEIGHT_OUTFLAGS 1; FLAG_MASKS 0x01,
          FLAG_OUTFLAGS 2; POLY_OUTWEIGHTS 0. Zero-weight and externally
          flagged pixels excluded on these thresholds. Values are stock, not
          derived from the CFIS weight distribution; rationale not recorded.
          The FLAG_* keys are inert in the committed invocation — no flag
          image is passed to WeightWatcher by Mask._exec_WW.
          Anchor: workflow/config/cfis/mask_default/default.ww#WEIGHT_MIN;
          workflow/config/cfis/mask_default/default.ww#FLAG_MASKS;
          src/shapepipe/modules/mask_package/mask.py::Mask._exec_WW.
        default: stock_ww_thresholds
        options:
          stock_ww_thresholds:
            label: Stock WeightWatcher thresholds
            insights: [farrens22_weightwatcher]
      external_flag_usage:
        label: CFIS external flag maps folded into exposure masks
        rationale: >-
          USE_EXT_FLAG=True on exposures (imports CADC-provided bad-pixel /
          cosmic-ray / trail flags); EF_MAKE=False on tiles. The external
          plane enters via Mask._build_final_mask's path_external_flag branch.
          Anchor: workflow/config/cfis/config_exp_Ma.ini#MASK_RUNNER.USE_EXT_FLAG;
          workflow/config/cfis/config_tile_onthefly.mask#EXTERNAL_FLAG.EF_MAKE;
          src/shapepipe/modules/mask_package/mask.py::Mask._build_final_mask.
        default: exposures_only
        options:
          exposures_only: { label: "External flags on exposures, not tiles" }
          ignore_external:
            label: Pipeline-generated masks only
            excluded: true
            excluded_reason: Discards upstream knowledge of bad pixels.
    prior_insights:
      farrens22_star_cat_on_disk:
        claim: >-
          The ShapePipe release paper documents an on-disk star catalogue, in
          GSC format, as a supported substitute for the online query,
          motivated by compute nodes without internet access.
        created_at: "2022-06-01T00:00:00Z"
        evidence:
          - id: ev_farrens22_star_cat_disk
            doi: "10.48550/arXiv.2206.14689"
            quote:
              exact: 'Alternatively, a star catalogue available on disk (with the same format as the GSC) can also be used'
            location: { page: 2 }
      farrens22_messier_mask:
        claim: >-
          Messier objects are named in the published masking procedure as one
          of the object classes ShapePipe masks.
        created_at: "2022-06-01T00:00:00Z"
        evidence:
          - id: ev_farrens22_messier
            doi: "10.48550/arXiv.2206.14689"
            quote:
              exact: 'Messier objects, and border regions.'
            location: { page: 2 }
      farrens22_border_mask:
        claim: >-
          CCD border regions are named in the published masking procedure as
          one of the regions ShapePipe masks.
        created_at: "2022-06-01T00:00:00Z"
        evidence:
          - id: ev_farrens22_border
            doi: "10.48550/arXiv.2206.14689"
            quote:
              exact: 'Messier objects, and border regions.'
            location: { page: 2 }
      farrens22_weightwatcher:
        claim: >-
          The published pipeline generates the mask image itself with
          WeightWatcher (Marmo & Bertin 2008), fixing the tool but none of its
