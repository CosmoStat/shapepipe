  # ═════════════════════════════════════════════════════════════════════════
  catalogue_assembly:
    description: >-
      The per-tile science catalogue: shape chunks merged and joined to the
      detection catalogue and PSF quantities.
    inputs:
      - id: ngmix_chunks
        type: data
        source: per-tile ngmix catalogue chunks + tile sexcat + PSF diagnostics
    outputs:
      - id: tile_final_cat
        type: data
        format: fits
        description: The assembled per-tile science catalogue (final_cat family).
        inputs: [ngmix_chunks]
        decisions:
          [star_galaxy_classification, tile_overlap_handling,
           failure_sentinels]
    decisions:
      star_galaxy_classification:
        label: Star/galaxy separation deferred out of the pipeline
        rationale: >-
          [HARDCODED] ShapePipe does no star/galaxy classification: make_cat
          keeps every detection, and the catalogue carries no classification
          column. Separation happens downstream, in sp_validation's size-based
          selection. The spread-model classifier Guinot+22 used
          (guinot22_spread_model_cut) is removed from the pipeline.
        default: deferred_downstream
        options:
          deferred_downstream:
            label: No in-pipeline classification; catalogue ships all objects
          spread_model_inline:
            label: spread_model classification in make_cat
            insights: [guinot22_spread_model_cut]
            excluded: true
            excluded_reason: >-
              It did not work reliably when last run, and it separates stars
              from galaxies worse than the downstream classification.
      tile_overlap_handling:
        label: Tile-overlap duplicates neither removed nor flagged
        rationale: >-
          Adjacent tiles overlap, and objects in the overlap are measured in
          both. [HARDCODED] make_cat attaches only TILE_ID; with no
          unique-object rule or overlap flag, duplicates are left to
          downstream selection. NUMBER_LIST selects input tiles; it does not
          carve disjoint sky regions, and no config key makes these catalogues
          unique or flags their overlap rows.
        default: no_dedup_in_pipeline
        options:
          no_dedup_in_pipeline:
            label: Ship duplicates; TILE_ID is the only handle
          overlap_flagging:
            label: Flag overlap objects in the catalogue
            description: Not implemented.
          nearest_tile_centre:
            label: Keep each object only in its nearest tile
            excluded: true
            excluded_reason: >-
              Requires cross-tile coordination at assembly time, which the
              per-tile DAG deliberately avoids.
      failure_sentinels:
        label: Objects without shape measurements kept, with sentinel values
        rationale: >-
          [HARDCODED] detections with no ngmix row (no surviving epoch, or an
          exception during the fit) stay in the catalogue with sentinels:
          sizes, fluxes and magnitudes 0, flux and magnitude errors -1,
          ellipticities and their errors -10, size errors 1e30,
          NGMIX_N_EPOCH 0. Their flag columns carry ngmix's own
          LM_FUNC_NOTFINITE bit (2**12; FLAGS_<SHEAR> and NGMIX_MCAL_FLAGS)
          and NGMIX_MCAL_TYPES_FAIL is 5, as for a metacal type that reports
          success without a finite shear, so the MCAL_FLAGS == 0 and
          MCAL_TYPES_FAIL == 0 cut rejects them; NGMIX_N_EPOCH == 0 tells
          them apart from fitted objects.
        default: sentinel_values
        options:
          sentinel_values:
            label: Keep with sentinels (flags LM_FUNC_NOTFINITE, e -10, T_ERR 1e30)
          drop_unmatched:
            label: Drop objects without shapes
            excluded: true
            excluded_reason: >-
              Loses the photometry-only population and hides attrition.
    prior_insights:
      guinot22_spread_model_cut:
        claim: >-
          The published analysis selects galaxies inside the pipeline with the
          spread model, at s + 2 sigma_s > 0.0003 together with s > 0 and
          20 < MAG_AUTO < 26.
        created_at: "2022-04-01T00:00:00Z"
        evidence:
          - id: ev_guinot22_spread_model
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 'We then use the spread model to make the selection presented below:'
            location: { page: 5 }
          - id: ev_guinot22_spread_model_cut
            doi: "10.48550/arXiv.2204.04798"
            quote:
              exact: 's + 2σs > 0.0003'
            location: { page: 5 }
