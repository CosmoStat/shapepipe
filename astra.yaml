        label: Stamp-metacal blend bias is mostly shear-dependent detection
        claim: >-
          Sheldon et al. 2020 find that per-stamp metacal's few-percent
          blending bias comes from shear-dependent detection, not blended
          light: it is similar with and without neighbour subtraction, and
