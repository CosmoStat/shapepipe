# ASTRA record of ShapePipe's scientific decisions: the choices embedded in
# the code and the committed workflow configs (workflow/config/cfis/), why
# they stand, and the alternatives. CLAUDE.md says when to amend it.
# workflow/config/cfis_image_sims/ is not yet in scope: its symlinks into
# cfis/ are governed there; its untagged overlays change input naming, the PSF
# model and some governed values (config_tile_Fe.ini COLNUM/EXP_PREFIX,
# final_cat.param columns).
#
# Conventions (`tests/helpers/decisions.py` implements them and documents the
# full value grammar; `tests/unit/test_decisions.py` enforces them):
#   * Put `@sc [decision:<id>]` at every code/config site that implements a
#     decision. Decision citations have no id or prose; the record is the source
#     of rationale. IDs are bare for top-level decisions and dotted for
#     sub-analysis decisions; repeat `decision:` metadata to cite several.
#     A local constraint adds a stable id and prose, with optional decision
#     metadata: `@sc [decision:<id>,label:<kind>] <contract-id>`.
#   * In Python, put tags in a def/class docstring or as a comment immediately
#     above a module statement. In Snakemake, put a comment immediately above
#     the rule/statement. In config, a tag governs the active settings in the
#     following paragraph, which ends at the next blank line or `@sc` line.
#     Every active key before that boundary is governed. A blank line between a
#     tag and its key is an error. To govern a whole section, put the tag
#     directly above its `[SECTION]` header; it governs active keys through the
#     next section header. A description comment may sit above the tag, and
#     `scope:file` governs the whole file.
#   * A rationale may end with `Values: <ref> = <value>; ... .`. Every ref must
#     resolve to exactly one site tagged for that decision and match its value.
#     Use a bare key when it selects one site; qualify it with a path suffix and
#     `#` or `::` when needed. `= absent` requires a same-decision tag somewhere
#     in the file (in that section or file-wide for INI/SETools) and asserts that
#     no active setting exists anywhere in the target scope. INI absence checks
#     include keys inherited from `[DEFAULT]`.
#   * The checker validates citations in both directions, unique local-contract
#     ids, literal values and test `decision` markers. The value grammar is
#     documented in the helper module's docstring.
#   * Universe `committed` in `universes:` pins the option the committed code
#     and configs select; `baseline_run1` pins run 1 as it ran.
#   * `excluded: true` means considered and rejected. An option the code
#     does not implement says so in its description and is not excluded.
#   * [HARDCODED]: the committed choice is fixed in code, with no config key.
#     [LINT]: the code disagrees with itself or its own documentation.
#   * A prior insight repeated inside a sub-analysis carries a `_local`
#     suffix, because insight ids are scoped.


spec_version: 0.1.0
label: ShapePipe scientific decisions
description: >-
  Codebase-level decision record for the ShapePipe weak-lensing pipeline (UNIONS/CFIS) as
  orchestrated by workflow/Snakefile. Membership test: a different defensible choice would
  change which objects enter the shear catalogue, or the numbers attached to them.
tags:
- shapepipe
- weak-lensing
- unions
- codebase-record
inputs:
  tile_list:
    label: Run-1 tile list
    path: auxdir/CFIS/tiles_202604/tiles_r.txt
    description: >-
      The 22,901 DR6 tiles run 1 processed: the 23,114 r-band DR6 tiles less 32 dateline duplicates
      and 181 tiles at Dec >= 82.5 (#969). Cut into HEALPix nside-4 cells and batches of about
      25 tiles, 16,123 ran on Nibi and 6,778 on Fir (fir-tiles.txt in the Fir production kit).
      The exposure list is not an input: tile_find_exposures reads it from the tile headers.
  workflow_config:
    label: Committed Snakemake workflow configuration
    path: workflow/config.yaml
    description: >-
      Committed default configuration of the ShapePipe Snakemake workflow: stage parameters,
      runner completeness tables and default resource limits.
analyses:
  masking:
    path: analyses/masking
  detection:
    path: analyses/detection
  star_selection_psf:
    path: analyses/star_selection_psf
  preparation:
    path: analyses/preparation
  shape_measurement:
    path: analyses/shape_measurement
  catalogue_assembly:
    path: analyses/catalogue_assembly
outputs:
  dr6_tile_stacks:
    label: DR6 r-band tile stacks
    type: data
    format: fits
    description: >-
      Source: vos:cfis/tiles_DR6/CFIS.<xxx.yyy>.r.fits and CFIS.<xxx.yyy>.r.weight.fits.fz.
      The MegaPipe DR6 r-band coadd of each 0.5° CFIS tile and its weight map: 400 MB image
      (10k × 10k float32) and a median 126 MB weight per tile, about 12 TB for run 1's 22,901
      tiles. Galaxies are detected and measured on these, and their primary-header HISTORY
      cards list the exposures each stack was built from, which is where the exposure list
      comes from. Read by tile_get_images (config_tile_Git.ini), then tile_uncompress, tile_find_exposures
      and tile_detect. Version: "DR6", nothing finer. Fir fetched each file with vcp and recorded
      its SHA-256 after the fetch (INPUTS.json of each batch); Nibi symlinked a local mirror
      (/project/def-mjhudson/unions-wl/tiles), whose agreement with CADC is not recorded.
      No file is checked against an upstream checksum.
    inputs:
    - tile_list
    recipe:
      command: >-
        shapepipe_run -c workflow/config/cfis/config_tile_Git.ini --tiles {inputs.tile_list}
        --out {output}
  unions_tile_catalogues:
    label: UNIONS DR6 tile catalogues
    type: data
    format: cat
    description: >-
      Source: vos:cfis/tiles_DR6/CFIS.<xxx.yyy>.r.cat. MegaPipe's SExtractor catalogue of
      each DR6 tile (median 7.3 MB; about 0.17 TB for run 1). tile_detect joins ShapePipe's
      own detections to it by mutual nearest neighbour within 1 px and takes its NUMBER, so
      TILE_UNIQUE_ID and the PhotoPipe join (TILE_ID, NUMBER) = (tile, SeqNr) come from it,
      and detections with no partner are dropped (detection.tile_detection). Read by tile_get_catalogue
      (config_tile_Gic.ini) into MATCH_CATALOGUE (config_tile_Sx.ini).
    inputs:
    - tile_list
    recipe:
      command: >-
        shapepipe_run -c workflow/config/cfis/config_tile_Gic.ini --tiles {inputs.tile_list}
        --out {output}
  dr6_exposures:
    label: DR6 exposures, weights and flag images
    type: data
    format: fits
    description: >-
      Source: vos:cfis/pitcairn/<expid>p.fits.fz, vos:cfis/weights/<expid>p.weight.fits.fz,
      vos:cfis/flags/<expid>p.flag.fits.fz. The Elixir-processed 40-CCD MegaCam exposures
      behind each tile, with their weight maps and instrument flag images: medians 339 MB,
      15 MB and 16 MB per exposure, 16,872 exposures and about 6.3 TB in run 1. The PSF is
      modelled on them and ngmix fits their postage stamps; the flag image is the only mask
      that reaches pixels (masking.pixel_mask_source). Read by exp_get_images (config_exp_Gie.ini),
      exp_split (config_exp_Sp.ini), exp_psf, exp_maps and tile_vignets. Fir fetched them
      from CADC; Nibi symlinked /project/def-mjhudson/unions-wl/exposures.
    inputs:
    - dr6_tile_stacks
    recipe:
      command: shapepipe_run -c workflow/config/cfis/config_exp_Gie.ini --out {output}
  healsparse_masks:
    label: DR6 sky-fixed mask ladder (dr6-2026-09-29)
    type: data
    format: hsp
    description: >-
      Source: vos:cfis/weak_lensing/ShapePipe/masks/ (ladder dr6-2026-09-29; Fir copy /project/def-waerbeke/cdaley/fir-assets/masks/dr6-2026-09-29/).
      Eleven boolean healsparse maps (nside 131072, True = masked), one per bit of the UNIONS
      mask: 1 and 2 star halos, 4 star bodies, 8 manual, 1024 MaxiMask, and 16, 32, 64, 128,
      256, 2048 for no u, g, r, i, Subaru z or Pan-STARRS z data. Made by the mask group (Mike
      Hudson) and declared final on 29 Sep 2026. make_cat queries them at each object's XWIN_WORLD/YWIN_WORLD
      into MASK_<bit>_<name> columns (config_tile_Mc.ini MASK_EXT_PATHS); nothing in ShapePipe
      cuts on them (masking.sky_mask_application). Every Fir batch records the same SHA-256s
      (ASSETS.json); a re-query of these maps on 14 tiles from every commit and both sites
      matches the catalogue's mask columns exactly.
    recipe:
      command: vcp vos:cfis/weak_lensing/ShapePipe/masks/ {output}
  container_image:
    label: ShapePipe runtime image
    type: data
    format: sif
    description: >-
      Source: shapepipe-develop-240b37e4.sif, sha256 94a791efd3de4eb585e95b5bb5c014f7ae3f5d3771bb46b41dffa4728ab43032.
      The Apptainer image that supplies SExtractor, PSFEx and the Python stack (816 MB, built
      from develop 240b37e4 on 28 Sep 2026). Run 1 ran each campaign's own ShapePipe source
      on top of it through PYTHONPATH, so the binaries and libraries are this image's and
      the code is the campaign's commit (universes.baseline_run1). Fir verified the SHA-256
      before every batch; Nibi is inferred to have used the same file, from which Fir's copy
      was made.
    recipe:
      command: apptainer pull {output} docker://ghcr.io/cosmostat/shapepipe:develop
  final_cat:
    label: Merged shear catalogue
    type: data
    format: hdf5
    description: >-
      The shear catalogue: every tile's final_cat merged across campaigns. Run 1's is run1-snap3/final_cat_latest.hdf5
      (449 GB, 772,677,301 objects on 22,901 tiles; vos:cfis/weak_lensing/ShapePipe/v2.x/run1-snap3/,
      Fir data/v2.x/run1-snap3/). The decisions here act across the chain.
    inputs:
    - catalogue_assembly.tile_final_cat
    - tile_list
    - container_image
    - workflow_config
    decisions:
    - per_unit_completeness
    - postage_stamp_size
    - photometric_zeropoint
    recipe:
      command: python workflow/scripts/merge_final_cats.py --tiles {inputs.tile_list} --out
        {output}
  star_catalogue:
    label: Merged PSF star catalogue
    type: data
    format: hdf5
    description: >-
      Every exposure's psfex_interp validation catalogue (held-out and training stars, star
      and PSF-model moments per CCD), stacked across campaigns into run1-snap3/full_starcat_latest.hdf5
      (1.7 GB, 11,194,784 stars).
    inputs:
    - catalogue_assembly.star_catalogue
    recipe:
      command: python workflow/scripts/merge_star_cats.py --out {output}
  coverage_maps:
    label: Survey coverage and defect maps
    type: data
    format: hsp
    description: >-
      Merged npoint, ntaken, nexp and nflagged healsparse maps across campaigns at the mask
      ladder's resolution.
    inputs:
    - masking.exposure_maps
    recipe:
      command: python workflow/scripts/merge_exposure_maps.py --out {output}
decisions:
  per_unit_completeness:
    label: Per-unit completeness gate
    rationale: >-
      Every shapepipe_run rule checks its products against a per-runner nominal count (per
      chunk for tile_ngmix). The unit fails if a non-warning runner falls short or shapepipe_run
      exits nonzero, and a failed unit publishes no manifest for later rules to build on.
      A tile needs the exp_psf manifest of every exposure it lists, so one failed exposure
      keeps every tile it contributes to out of the catalogue; the tile does not run with
      fewer epochs. The one tolerated shortfall is the exposure-side psfex_interp VALIDATION
      output. A CCD whose model fails the acceptance gate (star_selection_psf.psf_acceptance_thresholds)
      produces nothing there, and the unit only warns. Science-path PSF rejection bypasses
      this table: psfex_interp drops that epoch per object inside the tile run. The MCCD table
      (one mask_query catalogue per CCD; one train and one test catalogue per exposure) warns
      on every runner, and the workflow refuses psf_model=mccd. Values: COMPLETENESS[exp_psf.psfex.psfex_interp_runner.warn]
      = True; COMPLETENESS[exp_psf.mccd.mask_query_runner.expect] = 40; COMPLETENESS[exp_psf.mccd.mccd_preprocessing_runner.expect]
      = 2.
    options:
      exact_counts:
        label: Nominal count per runner; psfex_interp validation shortfall warns
        insights:
        - des_psf_blacklist
        - guinot22_star_floor_22
      count_floor:
        label: Tolerate recorded attrition down to a per-runner floor
        excluded: >-
          The floors had no basis: across a 127-exposure, 64-tile campaign every non-warning
          runner produced exactly its nominal count, so a floor below it only admits failed
          units unremarked.
      no_gate:
        label: Accept whatever is produced
        excluded: A stage producing 2 of 40 CCDs would flow into the catalogue unremarked.
  postage_stamp_size:
    label: Postage-stamp size shared by vignets, ngmix stamps and PSF models
    rationale: >-
      Every stamp width is 51 px (about 9.5 arcsec): the tile VIGNET (cut by the tile SExtractor
      run), the multi-epoch vignetmaker stamps ngmix fits, the exposure SExtractor VIGNET
      PSFEx trains on, and the PSFEx model stamp. Only the first two are coupled: ngmix lays
      the tile VIGNET's -1e30 neighbour markers over each epoch stamp pixel for pixel, so
      they must be the same size. The stamp truncates the wings of large galaxies. No rationale
      for 51 px is recorded. Values: default_noimaflags.param#VIGNET = 51; default.param#VIGNET
      = 51; VIGNETMAKER_RUNNER.STAMP_SIZE = 51; PSF_SIZE = 51.
    options:
      px_51:
        label: 51x51 px everywhere
      larger_adaptive:
        label: Larger or size-adaptive stamps
        description: >-
          Per-object sizes are not implemented. A larger fixed size is a config change, provided
          the tile VIGNET and the multi-epoch stamp change together.
  photometric_zeropoint:
    label: Magnitude zero-point convention
    rationale: >-
      Exposures read the per-image header PHOTZP, so the PSF-star MAG_AUTO window is on each
      exposure's own scale. Epochs are multiplied by header FSCALE before the joint fit, which
      puts them on zero-point 30 only if FSCALE = 10^(-0.4 (PHOTZP - 30)). Nothing in the
      repo checks this, but it held to 0.02% on a sampled exposure (2114045p). ngmix magnitudes
      use MAG_ZP = 30. The tile SExtractor run uses a fixed zero-point of 30 (ZP_FROM_HEADER=False),
      which assumes the MegaPipe stacks are calibrated to 30. Values: MAG_ZEROPOINT = 30.0;
      config_tile_Sx.ini#SEXTRACTOR_RUNNER.ZP_FROM_HEADER = False; NGMIX_RUNNER.MAG_ZP = 30.0;
      config_exp_psfex.ini#SEXTRACTOR_RUNNER.ZP_FROM_HEADER = True; SEXTRACTOR_RUNNER.ZP_KEY
      = PHOTZP.
    options:
      fixed_30_tiles_header_exposures:
        label: Tiles fixed 30.0; exposures from header PHOTZP
      header_everywhere:
        label: Per-image header zero-points on tiles too
        description: >-
          ZP_FROM_HEADER=True for tile SExtractor; changes tile magnitudes only where a tile's
          header zero-point differs from 30. ngmix MAG_ZP stays 30.
prior_insights:
  des_psf_blacklist:
    claim: >-
      DES blacklists a CCD's PSF model rather than failing the exposure: in Y3, a CCD with
      fewer than 25 stars surviving outlier rejection is excluded downstream (~2% of data
      removed) and processing proceeds.
    evidence:
    - doi: 10.48550/arXiv.2011.03409
      quote:
        exact: we enter it into a
        suffix: ' “blacklist” and exclude this CCD'
      location:
        value: page=10
  guinot22_star_floor_22:
    claim: >-
      The published ShapePipe/UNIONS analysis applies a per-CCD quality floor rather than
      failing whole exposures: a CCD with fewer than 22 selected stars is discarded for PSF
      estimation and contributes no epoch to the shape measurement, while processing continues.
    evidence:
    - doi: 10.48550/arXiv.2204.04798
      quote:
        exact: >-
          The dashed line represents the cut at 22 stars/CCD below which the CCD is discarded
          for the PSF estimation.
      location:
        value: page=4
universes:
  baseline_run1:
    label: Run 1 baseline (v2.0.0)
    description: >-
      Run 1 of ShapePipe v2 as it ran, the pipeline behind run1-snap3 and the v2.0.0 catalogue:
      22,901 DR6 tiles in 969 campaigns on Nibi and Fir, 10-27 Oct 2026, from ten integration/smk-g17..g19
      commits (61b6255f for 11,767 tiles, then 7f68451e, aad8cbce, 5df1e79c, de2b00f5, a169b3dc,
      ab4c2934, 255d4392, ba0d7032, 84e842dd), each run on the image shapepipe-develop-240b37e4.sif
      with the run config blend_handling uberseg, defect_fill interpolate, defect_weighting
      fourfold_zero. The ten commits make the same choice on every decision here. They differ
      only in the N_EPOCH definition of the 237 smk-g17 tiles (rewritten afterwards to the
      PSF-validated count), the tile pairing guard (no tile lost) and older coverage-map fragments
      (rebuilt). The baseline differs from develop (universes.committed) in one decision:
      run 1 predates the per-detection defect columns (shape_measurement.defect_flagging,
      #973). Develop also writes per-branch metacal shape errors (#1003), a column change
      outside the record.
    decisions:
      per_unit_completeness: exact_counts
      postage_stamp_size: px_51
      photometric_zeropoint: fixed_30_tiles_header_exposures
      masking.pixel_mask_source: instrument_flags_only
      masking.psf_star_mask_veto: instrument_flags_only
      masking.sky_mask_application: catalogue_columns
      masking.pointing_square: main_array_hull
      masking.nexp_map_valid_psf_ccds: valid_psf_ccds
      masking.defect_map_from_flags: count_flagged_pixels
      detection.tile_detection: unions_catalogue
      detection.detection_threshold_policy: megapipe_tiles
      detection.deblending_policy: megapipe_tiles
      detection.background_model: auto_megapipe_tiles
      detection.weight_map_usage: map_weight
      detection.zero_weight_interpolation: interp_all
      detection.spurious_detection_cleaning: clean_1
      detection.blend_photometry_mask_type: correct
      detection.saturation_level: header_saturate
      detection.photometry_parameters: kron_25_35
      detection.detection_source_mode: sx_nomask_single_image
      detection.epoch_membership_ccd_bounds: trimmed_bounds_33_2080
      preparation.astrometric_solution_source: delivered_headers
      preparation.ccd_split_extent: all_40_hdus
      preparation.epoch_provenance_from_tile_history: history_parse
      preparation.object_position_columns: xwin_windowed
      preparation.stamp_positioning_and_padding: round_and_zero_pad
      star_selection_psf.star_selection_box: locus_scaled_box
      star_selection_psf.psf_train_validation_split: split_80_20_seeded
      star_selection_psf.psfex_candidate_vetting: builtin_defaults
      star_selection_psf.psf_modelling_software: psfex
      star_selection_psf.psf_model_complexity: pixel_basis_deg2_per_ccd
      star_selection_psf.psf_sampling: native
      star_selection_psf.psf_chromaticity: achromatic
      star_selection_psf.psf_rendering: centred_model_stamp
      star_selection_psf.psf_acceptance_thresholds: stars22_chi2_2
      shape_measurement.ngmix_seed_mode: position_seed
      shape_measurement.galaxy_model: gauss
      shape_measurement.fit_initialisation: prior_guess_t025_ntry5_2
      shape_measurement.fit_priors: gpriorba04_flat
      shape_measurement.metacal_scheme: five_types_step001_fitgauss
      shape_measurement.centroid_source: wcs
      shape_measurement.epoch_flux_rescaling: fscale
      shape_measurement.psf_epoch_averaging: galaxy_weight_sum
      shape_measurement.galaxy_pixel_weights: rms_vignet_weights
      shape_measurement.psf_likelihood_noise: psf_noise_1em5
      shape_measurement.megacam_ccd_flip: megapipe_flip
      shape_measurement.defect_fill: interpolate
      shape_measurement.defect_flagging: stamp_wide_only
      shape_measurement.blend_handling: uberseg
      shape_measurement.defect_weighting: fourfold_zero
      shape_measurement.epoch_masked_fraction_cut: ten_percent
      shape_measurement.central_defect_veto: fixed_radii
      catalogue_assembly.star_galaxy_classification: deferred_downstream
      catalogue_assembly.tile_overlap_handling: no_dedup_in_pipeline
      catalogue_assembly.failure_sentinels: sentinel_values
  committed:
    label: Committed on develop
    description: The committed configuration on develop.
    derived_from: baseline_run1
    decisions:
      shape_measurement.defect_flagging: footprint_or_and_interp_epochs
