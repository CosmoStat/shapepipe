[project]
name = "shapepipe"
version = "1.1.0"
description = "Galaxy shape measurement pipeline."
readme = "README.rst"
authors = [
    { name = "Samuel Farrens", email = "samuel.farrens@cea.fr" },
    { name = "Axel Guinot", email = "axel.guinot@cea.fr" },
    { name = "Martin Kilbinger", email = "martin.kilbinger@cea.fr" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "astropy>=5.2",
    "astroquery",
    "canfar",
    "cs_util>=0.1",
    "galsim>=2.5.3",
    "h5py",
    "joblib>=0.13",
    "matplotlib>=3.8.4",
    "mccd>=1.2.4",
    "modopt>=1.2",
    "mpi4py",
    "numba>=0.58.1",
    "numpy>=1.14",
    "pandas",
    "python-dateutil",
    "python-pysap>=0.2.1",
    "PyQt5",
    "pyqtgraph",
    "reproject",
    "setuptools<81", # workaround for sf_tools/python-pysap importing pkg_resources
    "sf_tools",
    "skaha",
    "sqlitedict",
    "termcolor",
    "tqdm",
    "vos",
    "ngmix @ git+https://github.com/aguinot/ngmix@stable_version",
]


[project.optional-dependencies]
doc = [
    "myst-parser",
    "numpydoc",
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinx-book-theme"
]
lint = [
    "black",
    "isort"
]
release = [
    "build",
    "twine",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-pycodestyle",
    "pytest-pydocstyle"
]
fitsio = ["fitsio"]
dev = ["shapepipe[doc,lint,release,test]"]

[tool.setuptools]
script-files = [
    "bin/shapepipe_run.py",
    "bin/summary_run.py",
    "bin/canfar_submit_job.py",
    "bin/canfar_monitor.py",
    "bin/canfar_monitor_log.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--verbose --cov=shapepipe"
testpaths = ["shapepipe"]
