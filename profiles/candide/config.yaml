# Snakemake profile for the ShapePipe workflow on candide (IAP). Selected by
# `SP_PROFILE=candide workflow/bin/sp run`. Mirrors profiles/nibi/config.yaml;
# only the cluster facts differ, and each is stated where it is set.
executor: slurm
# candide is a shared ~25-node cluster: cap concurrent submissions well below
# what nibi takes.
jobs: 150
default-resources:
  mem_mb: 2000
  runtime: 120                   # minutes
  slurm_account: cusers
  # comp nodes have TmpDisk=0, so the tile_shape group (--tmp, see tile.smk's
  # TILE_SLURM_EXTRA) lands on pscomp; everything else may use either.
  slurm_partition: "comp,pscomp"
  # n09/n17/n36 follow sp_validation's candide exclusions; n23 has measured
  # SLURM job failures (sp_validation commit 2b40c99). n34/n35 (64 cores):
  # grid_3 vignets/ngmix jobs failed there with "Resource temporarily
  # unavailable" / "can't start new thread" (2026-09-30).
  slurm_extra: "'--exclude=n09,n17,n23,n34,n35,n36'"
software-deployment-method: [apptainer]
# /local/scratch is where tile.smk puts the node-local tile store (TILE_LOCAL,
# ~5.6 GB per real-data tile). candide has no /local, and its node-local /scratch
# is writable only per job (/scratch/$USER/$SLURM_JOB_ID, made by the prolog),
# which this line cannot name: snakemake passes it through literally, and
# --cleanenv drops SLURM_JOB_ID inside the container. The node's /tmp is NOT an
# option: it is a 31 GB disk shared by every job on the node, and filling it
# kills other people's jobs. So the default is a shared directory (NFS) on
# /n23data1; a campaign can move it with `tile_store_root:` in its run config,
# and bin/sp replaces this bind's source in the launch snapshot (see
# workflow/config.yaml), refusing a source under /tmp. The PYTHONPATH pin is
# rewritten by bin/sp to the launch snapshot's src/; the value here only has to
# be a checkout's src/. bin/sp also appends --env TMPDIR/JOBLIB_TEMP_FOLDER (its
# tmp_guard).
apptainer-args: "--cleanenv --env OMP_NUM_THREADS=1 --env MALLOC_ARENA_MAX=2 --env PYTHONPATH=/n17data/mkilbing/astro/repositories/github/shapepipe/src --bind /home,/automnt,/n17data,/n23data1,/n09data --bind /n23data1/mkilbing/shapepipe/tilestore:/local/scratch"
latency-wait: 60                 # NFS: wait for outputs to appear after a job
keep-going: true                 # a failed job poisons only its cone; siblings run on
# Retry transient node failures, including measured process-slot exhaustion
# (BlockingIOError, Errno 11) in tile_shape. Retries also activate attempt-scaled
# memory requests. See tile.smk for group retry semantics; tile_ngmix sets 2
# retries at rule level.
retries: 2
rerun-incomplete: true           # re-do jobs left incomplete by an unclean death
show-failed-logs: true
printshellcmds: true
rerun-triggers: [mtime, params, code, software-env]
# @sc [label:coupling] candide-group-slurm-extra
# tile_shape's rule-level slurm_extra replaces the profile default. Set both
# the --tmp floor and node exclusions identically on all four member rules:
# a group's string resources must agree. Leave rule threads and attempt-scaled
# memory intact.
set-resources:
  tile_vignets:
    slurm_extra: "'--tmp=16000 --exclude=n09,n17,n23,n34,n35,n36'"
  tile_ngmix:
    slurm_extra: "'--tmp=16000 --exclude=n09,n17,n23,n34,n35,n36'"
  tile_merge_cats:
    slurm_extra: "'--tmp=16000 --exclude=n09,n17,n23,n34,n35,n36'"
  tile_make_cat:
    slurm_extra: "'--tmp=16000 --exclude=n09,n17,n23,n34,n35,n36'"
