# Snakemake profile for the Nibi cluster (Digital Research Alliance).
#
# The SLURM executor submits one job per rule instance or fused group, using
# the rules' resources. Snakemake feeds the queue as jobs finish, so DR6's
# ~170k jobs do not queue at once.
#
# Launch via `workflow/bin/sp` (loads apptainer/1.4.5, uses the /project venv).
# software-deployment-method wraps every job's shell in `apptainer exec` — the
# user never types apptainer. The image is resolved in the Snakefile through
# workflow/scripts/container.py, whose docstring documents the layers and the
# resolution order; `sp container status` prints which layer is live.

executor: slurm

# Per-user submit cap, queried 2026-07-30 on nibi:
#   sacctmgr show assoc user=cdaley format=Account,MaxSubmitPU -P
#   -> def-mjhudson_cpu 1000, def-mjhudson_gpu 1000 (MaxSubmitPU; no site-wide
#      MaxSubmitJobs in `scontrol show config`, so the association limit governs)
# Set to ~80% of that (1000) so this workflow never starves other submissions
# under the same account. Re-query if the association limits change.
jobs: 800

default-resources:
  mem_mb: 2000
  runtime: 120                   # minutes
  slurm_account: def-mjhudson_cpu

software-deployment-method: [apptainer]
# Explicit container environment:
# --cleanenv isolates host variables (APPTAINERENV_*/SINGULARITYENV_* survive).
# OMP_NUM_THREADS=1 caps thread pools (measured OpenBLAS pool: 32 -> 1).
# MALLOC_ARENA_MAX=2 bounds allocator arenas.
# --home overrides Snakemake's workdir home so vos/vcp can read cadcproxy.pem.
# A different user must edit the literal --home path below.
# PYTHONPATH selects checkout modules for `sp container exec`; `sp run` rewrites
# it in the launch snapshot. See workflow/bin/sp's launch code snapshot note.
#
# @sc [label:coupling] nibi-static-container-paths
# apptainer-args must use literal paths: YAML does not interpolate variables,
# and Snakemake escapes `$` before the shell sees it. Bind /local, the NVMe
# mount (3.5 TB ext4), so tile.smk::tile_local can derive a campaign/tile path
# beneath /local/scratch. A login-node export cannot supply SLURM_TMPDIR for a
# future job; {resources.tmpdir} resolves to /tmp on nibi, a measured 378 GB
# RAM-backed tmpfs charged to the job's memory cgroup, not to NVMe storage.
apptainer-args: "--cleanenv --env OMP_NUM_THREADS=1 --env MALLOC_ARENA_MAX=2 --env PYTHONPATH=/project/def-mjhudson/cdaley/shapepipe-snakemake/src --home /home/cdaley --bind /project --bind /scratch --bind /local"

latency-wait: 60                 # NFS: wait for outputs to appear after a job
keep-going: true                 # a failed job poisons only its cone; siblings run on
rerun-incomplete: true           # re-do jobs left incomplete by an unclean death
show-failed-logs: true
printshellcmds: true

# No keep-incomplete: Snakemake deletes failed manifests and retains logs.
# See completeness.py for manifest/log semantics; show-failed-logs prints logs.

# Exclude the input trigger: tile.smk::tile_finished conditionally removes
# reclaimed exposure edges, and that change must not rerun finished tiles.
# Exposure-list changes propagate through find_exposures manifest mtimes;
# ngmix chunk counts are params. See tile.smk for reclaimed-edge handling.
rerun-triggers: [mtime, params, code, software-env]

# No set-threads/set-resources: overrides replace rule values (Snakemake 9.23),
# including attempt-scaled memory and ngmix threads. Rules own resource sizing
# and grouping; this profile supplies defaults only. See prepare.smk for
# tile_prep and tile.smk for tile_shape; exposure rules are ungrouped.
