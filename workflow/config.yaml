# Run configuration for the ShapePipe Snakemake workflow.
#
# A "run" is declared by a tile list plus the paths below. Everything here is
# read at parse time; none of it is a rule input, so editing it (e.g. appending
# tiles) never invalidates completed work — it only changes which jobs exist.

# The tile list that scopes this run (one "IDra.IDdec" per line).
# 186/187 quad: 18 unique exposures with cross-tile reuse — exercises the
# structural exposure dedup. (The 210/211 quad used earlier is unusable: its
# tile images are symlinks into anaennis' moved processed_tiles tree. ~8.5k of
# the 10.3k staged tiles are such broken links; ~600 tiles are real files.)
tile_list: /scratch/cdaley/shapepipe-output/smk-g3/tiles4.txt

# The container every job runs inside (apptainer software-deployment in the profile).
container: /project/def-mjhudson/cdaley/containers/shapepipe-develop-runtime.sif

# Where products land ($SP_RUN root). The sharded per-unit stores live under here:
#   <run_dir>/tiles/<2-char prefix>/<ID>/   and   <run_dir>/exp/<prefix>/<base>/
run_dir: /scratch/cdaley/shapepipe-output/smk-g3

# There is no config_src knob: the config chain is workflow/config/cfis, resolved
# relative to the Snakefile. The configs interpolate $SP_RUN / $SP_UNIT_NUM /
# $SP_CONFIG / $SP_EXP / $NGMIX_* and the rules export them -- configs and rules
# are one artefact and must version together, so the dir is fixed by construction.

# Pre-staged inputs (P3 data already on /project; get_images RETRIEVE=symlink).

# The mask star-catalogue CACHE root — run-independent, shared by every campaign.
# `exp_star_cat` writes <root>/exp/star_cat-<exp>.fits, one GSC 2.3 cone query per
# exposure (~787 KiB, ~6 s), and skips a cat that is already there. Exposures
# recur across tiles and batches, so the cache is mostly hits.
#
# THE CACHE IS NOT KEYED BY SCRIPT VERSION. A semantic change to
# scripts/python/create_star_cat.py (query radius, catalogue ID, column set)
# does rerun exp_star_cat — the script's hash is a rule param — but the rerun
# takes the skip-if-exists branch and only re-links the OLD catalogues. Clear
# this cache by hand when the change must reach the data.
#
# On /scratch because def-mjhudson /project is hard-full (27/27 TiB). The 60-day
# purge therefore applies, and that is acceptable: a purged cache regenerates one
# query per exposure. exp_star_cat declares its ccd-0 farm link as an output, so
# a purge leaves that link dangling and the rule reruns, instead of trusting a
# manifest that outlived its data.
star_cats: /scratch/cdaley/shapepipe-output/star-cat-cache

# The run index. Design intent (finding 15) is durable products on /project —
# BLOCKED for now: def-mjhudson /project is hard-full (27/27 TiB), so index and
# report live with the run on /scratch until space is reclaimed. Mind the
# 60-day purge for anything that must survive.
index_db: /scratch/cdaley/shapepipe-output/smk-g3/index/run_index.sqlite

# Rolling exposure-store reclamation (D5). When true, the COMPUTE DAG grows one
# `clean_exposure` job per exposure. It fires once every campaign tile that reads
# that exposure has its vignets, deletes the exposure's store AND its manifests,
# and leaves `cleaned.json`, which absorbs the manifests — `sp report` reads them
# back out of the tombstone and reports the exposure as `cleaned`. On here:
# the quad is validated against the bash baseline (validation verdict
# p0night1), so its exposure stores' inspection value is spent, and the
# campaign is scaling into the p3-batch1 tiles — 181 exposures un-cleaned
# would be ~1.2 TB against a 1 TiB scratch quota, so rolling reclamation is
# load-bearing from here on. Flipping it on reclaims retroactively — the
# missing tombstones schedule exactly the outstanding clean jobs.
clean: true

# Tiles that may NOT pin an exposure store (default: empty).
#
# An exposure is eligible for cleaning only once EVERY consuming tile has its
# vignets. One permanently-failed tile therefore holds all its exposures
# (~8 measured on P3: 7.9 exposures/tile) for the life of the campaign. A tile listed here is dropped from the
# consumer sets, and its exposures become eligible.
#
# READ THIS BEFORE ADDING A TILE. Ignoring a tile is a decision to give up its
# exposures' stores. If you later retry that tile, those exposure chains are
# gone and will be REBUILT from scratch — get_images, split, mask, psf, per
# exposure. That is correct, and expensive. Ignore a tile when you have decided
# it is dead, not while you are still debugging it.
clean_ignore_tiles: []

# ngmix within-tile chunking: static N chunks (closed ID ranges computed
# per-tile, in-job, from the tile's own sexcat).
ngmix_chunks: 8

# The container's installed shapepipe is overridden by the prod worktree via
# --env PYTHONPATH in profiles/nibi (settled call 3); no config knob here.
# build_index.py's missing-tile fraction floor is passed by workflow/bin/sp
# (SP_MISSING_THRESHOLD, default 0.0 = any missing tile is fatal).
