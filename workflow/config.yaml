# Run configuration for the ShapePipe Snakemake workflow.
#
# A run config given via SP_RUN_CONFIG is merged on top of this file, then
# the `machines:` entry for (machine, input_type) fills anything still unset:
#
#   SP_PROFILE=<nibi|candide> SP_RUN_CONFIG=/path/to/run.yaml workflow/bin/sp run
#
# Everything is read at parse time; editing it (e.g. appending tiles) never
# invalidates completed work.

# Cluster; must match SP_PROFILE (default nibi).
machine: nibi
#machine: candide

# data (survey, config/cfis) or image_sims (SKiLLS, config/cfis_image_sims).
input_type: data

# psfex, mccd, or fake (image_sims only: true PSF from `psf_dict`).
psf_model: psfex

# Run name, available as `$run` in the paths below.
run: smk-g6

# Per machine and input_type: tile_list, retrieve (symlink|vos), inputs,
# outputs, container. A key set at top level (or in SP_RUN_CONFIG) overrides
# it. `$base_dir` expands to the machine's base_dir, `$run` to `run:`.
# TBD = not known yet; the run refuses to start until it is set.
#
# outputs: run_dir = scratch root for intermediates; products_dir = persistent
# root for final catalogues, index and report (omit to use run_dir);
# index_db = tile/exposure index.
machines:
  nibi:
    base_dir: /project/def-mjhudson
    data:
      tile_list: $base_dir/cdaley/sp-products/$run/tiles.txt
      retrieve: symlink
      inputs:
        tiles: $base_dir/unions-wl/tiles
        exposures: $base_dir/unions-wl/exposures
      outputs:
        run_dir: /scratch/cdaley/shapepipe-output/$run
        products_dir: $base_dir/cdaley/sp-products/$run
        index_db: $base_dir/cdaley/sp-products/$run/index/run_index.sqlite
      container: $base_dir/cdaley/containers/shapepipe-develop-runtime.sif

  candide:
    base_dir: /n17data/UNIONS/WL
    data:
      retrieve: vos
      tile_list: TBD
      inputs:
        tiles: TBD          # vos: URL
        exposures: TBD
      outputs:
        run_dir: TBD
        index_db: TBD
      container: /n17data/cdaley/containers/shapepipe_develop-runtime-20260718.sif
    image_sims:
      # tile_list, inputs, outputs: per SKiLLS campaign, in its own run config,
      # e.g. inputs.tiles: /n09data/hervas/skills_out/<grid>/images/SP_tiles
      retrieve: symlink
      container: /n17data/cdaley/containers/shapepipe_im_sims-runtime.sif

# Per-exposure store reclamation once every tile reading it has its vignets.
clean: true

# Per-tile store reclamation after the tile's final_cat. Needed above ~850
# tiles (scratch quota); deletes the per-tile data sp_tilecost/sp_costmodel
# read. Set both false for a small control run you want to re-measure.
clean_tiles: true

# Failed tiles that should not keep their exposures from being cleaned.
# Their exposures are rebuilt from scratch if the tile is retried.
clean_ignore_tiles: []

# ngmix chunks per tile.
ngmix_chunks: 8

# Node-local tile store (vignets, WCS). Unset: the profile's /local/scratch
# bind (nibi NVMe, candide node /tmp). Dense image-sim campaigns on candide
# want a shared directory instead.
# tile_store_root: /n23data1/<user>/shapepipe/tilestore
