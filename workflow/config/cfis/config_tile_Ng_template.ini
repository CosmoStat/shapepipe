# ShapePipe configuration file for tiles: ngmix + KSB


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
# Per-chunk run dir: the workflow exports SP_NGMIX_CHUNK=<k> for each chunk.
# RUN_NAME is env-expanded (run.py getexpanded); braces keep the trailing "u"
# out of the variable name.
RUN_NAME = run_sp_tile_ngmix_Ng${SP_NGMIX_CHUNK}u

# Add date and time to RUN_NAME, optional, default: False
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
MODULE = ngmix_runner

# Parallel processing mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# NUMBER_LIST selects this unit; the workflow sets SP_UNIT_NUM to the
# dashed tile ID (e.g. -210-282).
NUMBER_LIST = $SP_UNIT_NUM

# Input directory, containing input files, single string or list of names
INPUT_DIR = .

# Output directory
OUTPUT_DIR = $SP_RUN/output


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 1

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

# Model-fitting shapes with ngmix
[NGMIX_RUNNER]

# INPUT and OUTPUT are independent here, and that is what makes node-local
# staging possible: [FILE] OUTPUT_DIR stays $SP_RUN/output (scratch, durable
# for the life of the job's tile), while the two directories ngmix actually
# READS AT RANDOM -- the psfex_interp galaxy_psf store and the vignetmaker
# run_2 image/background/weight/flag vignet stores, together the ~5.6 GB
# per-tile vignette store that all 8 chunks re-read -- come from
# $NGMIX_VIGNET_DIR.
#
# $NGMIX_VIGNET_DIR is the tile's run_sp_tile_PiViVi directory. tile_ngmix
# (workflow/rules/tile.smk) copies that directory to the job's node-local
# NVMe ($SLURM_TMPDIR) and points this variable at the copy; the outputs
# below are unaffected and still land on scratch. Set it to
# $SP_RUN/output/run_sp_tile_PiViVi to read the store in place.
#
# It is NOT optional: ShapePipe's config expansion is strict
# (pipeline/config.py::_expandvars_strict), so an unset $NGMIX_VIGNET_DIR is
# a loud error rather than a silent read of the wrong tree.
INPUT_DIR = $SP_RUN/output/run_sp_tile_Sx/sextractor_runner/output, $NGMIX_VIGNET_DIR/psfex_interp_runner/output, $NGMIX_VIGNET_DIR/vignetmaker_runner_run_2/output, $SP_RUN/output/run_sp_tile_Mh_exp/merge_headers_runner/output

FILE_PATTERN = sexcat, image_vignet, background_vignet, galaxy_psf, weight_vignet, flag_vignet, log_exp_headers

FILE_EXT = .fits, .sqlite, .sqlite, .sqlite, .sqlite, .sqlite, .sqlite

# NUMBERING_SCHEME (optional) string with numbering pattern for input files
NUMBERING_SCHEME = -000-000

# BKG_RMS_VIGNET_PATH (optional): per-pixel BACKGROUND_RMS vignets, used as
# 1/RMS^2 inverse-variance ngmix weights. When set, the file must exist for
# every tile (missing file -> error, no per-tile fallback); omit the option
# entirely to fall back to the scalar sigma_mad noise estimate.
BKG_RMS_VIGNET_PATH = $NGMIX_VIGNET_DIR/vignetmaker_runner_run_2/output/background_rms_vignet{file_number_string}.sqlite

# Number of objects to batch save during processing, optional. Omit or set
# to -1 for no batch saving.
# 250 (folded from runs/p3-batch1/cfis): worker RSS grows ~4.8 MB/object
# until the flush recycles it -> peak ~1.1 GB + 250 x 4.8 MB ~= 2.3 GB/worker
# (A/B test, job 17607877). Not superseded by -b {threads} (that sets fork
# width, this bounds per-worker memory).
SAVE_BATCH = 250

# Magnitude zero-point
MAG_ZP = 30.0

# Pixel scale in arcsec
PIXEL_SCALE = 0.186

# SEED_FROM_POSITION: per-object RNG seeded from sky position (ra, dec, ccd)
# instead of one ordered per-tile stream, so results are bit-identical under
# any chunking (D4/#796). Required for the chunked ngmix scatter/gather.
SEED_FROM_POSITION = True

# ID_OBJ_MIN/MAX: this chunk's closed SExtractor NUMBER-column range,
# computed at execution time from the tile's own object count and expanded
# via ShapePipe's getexpanded (ngmix_runner.py verified: env-expanded, not
# plain getint).
ID_OBJ_MIN = $NGMIX_ID_MIN
ID_OBJ_MAX = $NGMIX_ID_MAX
