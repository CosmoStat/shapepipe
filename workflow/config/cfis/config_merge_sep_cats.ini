# ShapePipe post-run configuration file: merge separated catalogues


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
RUN_NAME = run_sp_Ms

# Add date and time to RUN_NAME, optional, default: True
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
MODULE = merge_sep_cats_runner

# Parallel processing mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# NUMBER_LIST selects this unit; the workflow sets SP_UNIT_NUM to the
# dashed tile ID (e.g. -210-282).
NUMBER_LIST = $SP_UNIT_NUM

# Input directory, containing input files, single string or list of names with length matching FILE_PATTERN
# NOTE: only chunk 1's ngmix output is listed here; merge_sep_cats_runner
# derives the other chunks' paths itself from N_SPLIT_MAX and this pattern
# (chunk dirs are run_sp_tile_ngmix_Ng<k>u, k=1..N_SPLIT_MAX), all under the
# same fixed output dir.
#
# RELATIVE ON PURPOSE (do not "fix" this to $SP_RUN/...): merge_sep_cats derives
# chunk k's path with re.sub("1", str(k), input_file, 1) -- it replaces the FIRST
# "1" in the path. An absolute path under the sharded store
# (.../tiles/21/210.282/...) has digits before "Ng1u", so chunk 2 would be looked
# for in a nonexistent directory. Every rule runs shapepipe_run with cwd=$SP_RUN,
# so "./output/..." resolves and "Ng1u" carries the first "1".
INPUT_DIR = ./output/run_sp_tile_ngmix_Ng1u/ngmix_runner/output

# Output directory
OUTPUT_DIR = $SP_RUN/output


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 8

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

[MERGE_SEP_CATS_RUNNER]

# Input file pattern(s), list of strings with length matching number of expected input file types
# Cannot contain wild cards
FILE_PATTERN = ngmix

# FILE_EXT (optional) list of string extensions to identify input files
FILE_EXT = .fits

# Numbering convention, string that exemplifies a numbering pattern.
NUMBERING_SCHEME = -000-000

# WARNING (optional, default is 'error'). Use 'always'/'ignore' to
# display/ignore warnings, and not raise error 
WARNING = always

# Maximum number of separated catalogues per input.
# merge_sep_cats_runner.py reads this with getexpanded (runner .py line ~31), so
# $NGMIX_N_CHUNKS DOES expand here, exactly like ID_OBJ_MIN/MAX in the ngmix
# module. The tile_merge_cats rule exports it from the workflow's scattergather
# chunk count, which is the single source of truth; this value must equal that
# count, so do not replace it with a literal.
N_SPLIT_MAX = $NGMIX_N_CHUNKS
