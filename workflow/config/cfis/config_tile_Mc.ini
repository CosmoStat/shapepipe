# ShapePipe post-run configuration file: create final catalogs


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
RUN_NAME = run_sp_tile_Mc

# Add date and time to RUN_NAME, optional, default: True
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
MODULE = make_cat_runner

# Parallel processing mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# Input directory, containing input files, single string or list of names with length matching FILE_PATTERN
INPUT_DIR = .

# Output directory
OUTPUT_DIR = ./output


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 8

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

[MAKE_CAT_RUNNER]

# Input directory, containing input files, single string or list of names with length matching FILE_PATTERN
# The psfex_interp store is NODE-LOCAL: it is the vignette-store run this
# tile's fused group job wrote to node-local storage (see config_tile_PiViVi_<psf_model>.ini
# and workflow/rules/tile.smk). $NGMIX_VIGNET_DIR names it; the other two
# inputs and this run's own output stay on $SP_RUN.
INPUT_DIR = $SP_RUN/output/run_sp_tile_Sx/sextractor_runner/output, $NGMIX_VIGNET_DIR/${SP_PSF}_interp_runner/output, $SP_RUN/output/run_sp_tile_Ms/merge_sep_cats_runner/output

# Input file pattern(s), list of strings with length matching number of expected input file types
# Cannot contain wild cards
FILE_PATTERN = sexcat, galaxy_psf, ngmix

# NUMBER_LIST selects this unit; the workflow sets SP_UNIT_NUM to the
# dashed tile ID (e.g. -210-282)
NUMBER_LIST = $SP_UNIT_NUM

# FILE_EXT (optional) list of string extensions to identify input files
FILE_EXT = .fits, .sqlite, .fits

# Numbering convention, string that exemplifies a numbering pattern.
# Matches input single exposures (with 'p' removed)
# Needs to be given in this section, will be updated in module
# sections below
NUMBERING_SCHEME = -000-000

SHAPE_MEASUREMENT_TYPE = ngmix

# The catalogue is built here and moved to OUTPUT_DIR once complete. Node-local
# ($SP_LOCAL, exported by tile.smk's tile_local() prologue): each save stage
# rewrites the whole file, which is tens of times slower on NFS scratch.
WORK_DIR = $SP_LOCAL/make_cat

# Save per-epoch PSF shapes and epoch identity (HSM_*_PSF_n, EXP_ID_n,
# CCD_n). The campaign merge needs one column schema across all tiles, so
# the slot count is fixed rather than per-tile max(N_EPOCH)+1. It must
# exceed the survey's maximum epochs per object with margin (smk-g7: max 6
# over 8 inspected tiles); an object with more epochs than slots is an error.
SAVE_PSF_DATA = True
N_EPOCH_SLOTS = 12

# The UNIONS sky-fixed masks, queried once per object and written as one
# MASK_<label> column per map onto the final catalogue. $SP_INPUT_MASKS is the
# `inputs.masks` root the workflow exports (workflow/config.yaml). The products
# are the post-GSC2-fix band-combined ugriz ladder: ONE BOOLEAN MAP PER BIT,
# nside 131072, True = masked. Each label is `<flag value>_<name>`, so the
# columns land as MASK_1_Faint_star_halos ... MASK_2048_z2 — matched line for
# line in final_cat.param. The flag value is the one in the map's file name
# (`_n<value>.hsp`); the names are sp_validation's (ApplyHspMasks).
#
#   1_Faint_star_halos, 2_Bright_star_halos, 4_Stars (star bodies), 8_Manual,
#   1024_Maximask: defects.
#   16_u, 32_g, 64_r, 128_i, 256_z (HSC z), 2048_z2 (Pan-STARRS z): footprints,
#   True where there is NO data in that filter — a coverage flag, not a defect.
#   (512, the tile RA/Dec cut, is geometric and has no map — hence 11 maps.)
#
# MASK_2048_z2 is True across whole tiles outside the Pan-STARRS z footprint,
# so an OR over all MASK_ columns masks everything. A position with no map
# coverage reads boolean False, indistinguishable from clean. ShapePipe cuts
# on none of these columns; which to cut on is decided in sp_validation.
#
# PSF-star selection deliberately does NOT consume these: MASK_PATHS in
# config_exp_psfex.ini stays commented out, keeping the star diet narrow
# (instrument flags only). See that file's header.
# @sc [decision:masking.sky_mask_application]
MASK_EXT_PATHS =
    1_Faint_star_halos:$SP_INPUT_MASKS/mask_ugriz_nside131072_n1.hsp,
    2_Bright_star_halos:$SP_INPUT_MASKS/mask_ugriz_nside131072_n2.hsp,
    4_Stars:$SP_INPUT_MASKS/mask_ugriz_nside131072_n4.hsp,
    8_Manual:$SP_INPUT_MASKS/mask_ugriz_nside131072_n8.hsp,
    16_u:$SP_INPUT_MASKS/mask_ugriz_nside131072_n16.hsp,
    32_g:$SP_INPUT_MASKS/mask_ugriz_nside131072_n32.hsp,
    64_r:$SP_INPUT_MASKS/mask_ugriz_nside131072_n64.hsp,
    128_i:$SP_INPUT_MASKS/mask_ugriz_nside131072_n128.hsp,
    256_z:$SP_INPUT_MASKS/mask_ugriz_nside131072_n256.hsp,
    1024_Maximask:$SP_INPUT_MASKS/mask_ugriz_nside131072_n1024.hsp,
    2048_z2:$SP_INPUT_MASKS/mask_ugriz_nside131072_n2048.hsp
