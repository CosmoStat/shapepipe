# ShapePipe configuration file for tile object selection using
# an (external) catalogue


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
RUN_NAME = run_sp_tile_Uc

# Add date and time to RUN_NAME, optional, default: True
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
MODULE = read_ext_sexcat_runner
         

# Run mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# NUMBER_LIST selects this unit; the workflow sets SP_UNIT_NUM to the
# dashed tile ID (e.g. -210-282).
NUMBER_LIST = $SP_UNIT_NUM

# Input directory, containing input files, single string or list of names with length matching FILE_PATTERN
INPUT_DIR = $SP_RUN/output

# Output directory
OUTPUT_DIR = $SP_RUN/output


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 16

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

[READ_EXT_SEXCAT_RUNNER]

# NOTE(blocker): run_sp_tile_Gic (external-catalog get_images) is not one of
# the 13 configs in this sweep -- no committed config produces it, so this
# path is written by naming-convention analogy, unverified. Uc is otherwise
# fully de-wrapper-ified; do not rely on this input until Gic exists.
INPUT_DIR = $SP_RUN/output/run_sp_tile_Gic/get_images_runner/output, $SP_RUN/output/run_sp_tile_Git/get_images_runner/output, $SP_RUN/output/run_sp_tile_Mh_exp/merge_headers_runner/output

FILE_PATTERN = CFIS_cat, CFIS_image, log_exp_headers

FILE_EXT = .cat, .fits, .sqlite

# NUMBERING_SCHEME (optional) string with numbering pattern for input files
NUMBERING_SCHEME = -000-000

# File name suffix for the output sextractor files (optional)
SUFFIX = sexcat

# Side length of the square postage stamp (vignet) extracted from the tile
# image, in pixels (must be odd). Default: 51
VIGNET_SIZE = 51

## Post-processing

# Necessary for tiles, to enable multi-exposure processing
MAKE_POST_PROCESS = True

# World coordinate keywords, SExtractor output. Format: KEY_X,KEY_Y
WORLD_POSITION = ALPHA_J2000,DELTA_J2000

# Number of pixels in x,y of a CCD. Format: Nx,Ny
CCD_SIZE = 33,2080,1,4612
