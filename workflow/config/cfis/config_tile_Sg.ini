# ShapePipe configuration file for the tile SEGMENTATION map, used when
# `tile_detection: unions_catalogue` is combined with `blend_handling: uberseg`
# in the workflow run config.
#
# The UNIONS per-tile catalogue is the galaxy sample; this run exists only for
# the one product that catalogue cannot carry, the segmentation map UberSeg
# needs. Its own sexcat is a by-product and nothing reads it. The detection
# settings are those of config_tile_Sx.ini, so the footprints are the ones a
# SExtractor-detection run would have drawn.
#
# The labels of the SEGMENTATION check image are this run's own NUMBERs, which
# are not the converted catalogue's; workflow/scripts/seg_relabel.py maps them
# into the catalogue's NUMBER space and writes the result beside the sexcat.


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
RUN_NAME = run_sp_tile_Sg

# Add date and time to RUN_NAME, optional, default: True
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
MODULE = sextractor_runner

# Run mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# NUMBER_LIST selects this unit; the workflow sets SP_UNIT_NUM to the
# dashed tile ID (e.g. -210-282).
NUMBER_LIST = $SP_UNIT_NUM

# Input directory, containing input files, single string or list of names with length matching FILE_PATTERN
INPUT_DIR = $SP_RUN/output

# Output directory
OUTPUT_DIR = $SP_RUN/output


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 16

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

[SEXTRACTOR_RUNNER]

# The tile image and its weight. The merged WCS headers are absent because
# MAKE_POST_PROCESS is False: the multi-epoch extensions belong to the sexcat
# the chain reads, which config_tile_Uc.ini writes.
INPUT_DIR = $SP_RUN/output/run_sp_tile_Git/get_images_runner/output, $SP_RUN/output/run_sp_tile_Uz/uncompress_fits_runner/output

FILE_PATTERN = CFIS_image, CFIS_weight

FILE_EXT = .fits, .fits

# NUMBERING_SCHEME (optional) string with numbering pattern for input files
NUMBERING_SCHEME = -000-000

# SExtractor executable path
EXEC_PATH = source-extractor

# SExtractor configuration files
DOT_SEX_FILE = $SP_CONFIG/default_tile.sex
DOT_PARAM_FILE = $SP_CONFIG/default_noimaflags.param
DOT_CONV_FILE = $SP_CONFIG/default.conv

# Use input weight image if True
WEIGHT_IMAGE = True

# Use input flag image if True
FLAG_IMAGE = False

# Use input PSF file if True
PSF_FILE = False

# Use distinct image for detection (SExtractor in
# dual-image mode) if True
DETECTION_IMAGE = False

# Distinct weight image for detection (SExtractor
# in dual-image mode)
DETECTION_WEIGHT = False

ZP_FROM_HEADER = False

BKG_FROM_HEADER = False

# Type of image check (optional), default not used, can be a list of
# BACKGROUND, BACKGROUND_RMS, INIBACKGROUND,
# MINIBACK_RMS, -BACKGROUND, #FILTERED,
# OBJECTS, -OBJECTS, SEGMENTATION, APERTURES
#
# SEGMENTATION alone: this run's reason to exist. BACKGROUND is the tile
# background config_tile_Sx.ini writes for the detection chain, and nothing
# reads it from here.
CHECKIMAGE = SEGMENTATION

# File name suffix for the output sextractor files (optional)
SUFFIX = sexcat

## Post-processing

# The multi-epoch extensions ride on the sexcat the chain reads, not on this
# run's by-product catalogue.
MAKE_POST_PROCESS = False
