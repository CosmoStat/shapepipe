# ShapePipe configuration file for single-exposures. MCCD PSF model.
# Process exposures after splitting, from star detection to PSF model.
# ShapePipe generates no masks: SExtractor reads the instrument flag image
# delivered with the exposure, and mask_query flags detections against the
# external healsparse maps (see [MASK_QUERY_RUNNER] below).


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
RUN_NAME = run_sp_exp_SxSePsf

# Add date and time to RUN_NAME, optional, default: True
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
MODULE = sextractor_runner, mask_query_runner, setools_runner,
         mccd_preprocessing_runner, mccd_fit_val_runner

# Run mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# Input directory, containing input files, single string or list of names with length matching FILE_PATTERN
INPUT_DIR = $SP_RUN/output

# Output directory
OUTPUT_DIR = $SP_RUN/output


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 8

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

[SEXTRACTOR_RUNNER]

# The split CCDs, and nothing else: ShapePipe generates no masks
INPUT_DIR = $SP_RUN/output/run_sp_exp_Sp/split_exp_runner/output

# Read the instrument flag image split_exp wrote per CCD
FILE_PATTERN = image, weight, flag

# Explicit extensions: a 3-entry FILE_PATTERN override must not fall back on
# the decorator's 4-entry FILE_EXT default (length check fails at startup)
FILE_EXT = .fits, .fits, .fits

NUMBERING_SCHEME = -0000000-0

# SExtractor executable path
EXEC_PATH = source-extractor

# SExtractor configuration files
DOT_SEX_FILE = $SP_CONFIG/default_exp.sex
DOT_PARAM_FILE = $SP_CONFIG//default.param
DOT_CONV_FILE = $SP_CONFIG/default.conv

# Use input weight image if True
WEIGHT_IMAGE = True

# Use input flag image if True
FLAG_IMAGE = True

# Use input PSF file if True
PSF_FILE = False

# Use distinct image for detection (SExtractor in
# dual-image mode) if True.
DETECTION_IMAGE = False

# Distinct weight image for detection (SExtractor
# in dual-image mode)
DETECTION_WEIGHT = False

# True if photometry zero-point is to be read from exposure image header
ZP_FROM_HEADER = True

# If ZP_FROM_HEADER is True, zero-point key name
ZP_KEY = PHOTZP

# Background information from image header.
# If BKG_FROM_HEADER is True, background value will be read from header.
# In that case, the value of BACK_TYPE will be set atomatically to MANUAL.
# This is used e.g. for the LSB images.
BKG_FROM_HEADER = False
# LSB images:
# BKG_FROM_HEADER = True

# If BKG_FROM_HEADER is True, background value key name
# LSB images:
#BKG_KEY = IMMODE

# Type of image check (optional), default not used, can be a list of
# BACKGROUND, BACKGROUND_RMS, INIBACKGROUND, MINIBACK_RMS, -BACKGROUND,
# FILTERED, OBJECTS, -OBJECTS, SEGMENTATION, APERTURES
CHECKIMAGE = BACKGROUND, BACKGROUND_RMS

# File name suffix for the output sextractor files (optional) SUFFIX = tile
SUFFIX = sexcat

## Post-processing

# Not required for single exposures
MAKE_POST_PROCESS = FALSE


[MASK_QUERY_RUNNER]

INPUT_DIR = $SP_RUN/output/run_sp_exp_SxSePsf/sextractor_runner/output

# Note: Make sure this does not match the SExtractor background images
# (sexcat_background*)
FILE_PATTERN = sexcat

NUMBERING_SCHEME = -0000000-0

# The PSF-star diet, and it is deliberately NARROW: instrument flags (read by
# SExtractor as IMAFLAGS_ISO) plus the healsparse star-body map (UNIONS bit 2),
# and nothing else. Halo bits 0 and 1 are excluded on purpose — halos flag
# objects for the final catalogue, they do not reject PSF stars (mask-force
# telecon, 2026-07-21) — and MaxiMask is not in the diet either. Widen it by
# adding paths here; every map that is True (boolean) or nonzero (integer) at a
# detection sets MASK_EXT. Comma-separated.
#
# UNSET BY DEFAULT, and the module is a strict no-op without it: the catalogue
# is passed through with no MASK_EXT column, the same gating make_cat gives
# MASK_EXT_PATHS. mask_query stays in the MODULE chain either way, so turning
# the query on is uncommenting one line and never editing the chain.
#
# Even with it set, NOTHING CUTS ON IT: the star selection ships permissive
# (instrument flags only) and the column is carried for transparency and
# measurement — see star_selection.setools' header for the one-line change
# that would impose it.
; MASK_PATHS = $SP_CONFIG/mask_ugriz_nside131072_n4.hsp

# Optional: restrict integer maps to these bits (value & MASK_BITS). Absent,
# any nonzero value flags. Boolean maps — the UNIONS per-bit products, one map
# per bit — ignore it, which is why the diet above is a path list and not a
# bit mask.
; MASK_BITS = 4


[SETOOLS_RUNNER]

INPUT_DIR = $SP_RUN/output/run_sp_exp_SxSePsf/mask_query_runner/output

FILE_PATTERN = sexcat_ext

NUMBERING_SCHEME = -0000000-0

# SETools config file
SETOOLS_CONFIG_PATH = $SP_CONFIG/star_selection.setools


# The MCCD chain differs from the PSFEx one only from here on; everything up
# to the star selection is the same, so the two PSF models are fitted on the
# same stars. Every module below chains from the one before it in this run
# (the decorators' input_module), so none needs an INPUT_DIR.
#
# Not in this chain: merge_starcat_runner and mccd_plots_runner. exp_psf runs
# once per exposure here; their diagnostics are not needed by the tile rules.

[MCCD_PREPROCESSING_RUNNER]

# Serial runner: it receives every CCD's star catalogues of this exposure and
# writes one focal-plane training (80%) and one test (20%) catalogue for it.
FILE_PATTERN = star_split_ratio_80, star_split_ratio_20

FILE_EXT = .fits, .fits

NUMBERING_SCHEME = -0000000-0

# Path to MCCD config file
CONFIG_PATH = $SP_CONFIG/config_MCCD.ini

MODE = FIT_VALIDATION

VERBOSE = False


[MCCD_FIT_VAL_RUNNER]

# One focal-plane model per exposure: fitted_model-<exp>.npy, which the tiles'
# mccd_interp_runner reads (config_tile_PiViVi_mccd.ini, ME_DOT_PSF_PATTERN),
# and validation_psf-<exp>.fits, the model at the 20% test stars.
NUMBERING_SCHEME = -0000000

# Path to MCCD config file
CONFIG_PATH = $SP_CONFIG/config_MCCD.ini

MODE = FIT_VALIDATION

VERBOSE = False
