# ShapePipe configuration file for tile, from detection  up to shape measurement.
# PSFEx PSF model.


## Default ShapePipe options
[DEFAULT]

# verbose mode (optional), default: True, print messages on terminal
VERBOSE = True

# Name of run (optional) default: shapepipe_run
RUN_NAME = run_sp_tile_PiViVi

# Add date and time to RUN_NAME, optional, default: False
RUN_DATETIME = False


## ShapePipe execution options
[EXECUTION]

# Module name, single string or comma-separated list of valid module runner names
#MODULE = psfex_interp_runner,

MODULE = psfex_interp_runner, vignetmaker_runner, vignetmaker_runner

# Parallel processing mode, SMP or MPI
MODE = SMP


## ShapePipe file handling options
[FILE]

# Log file master name, optional, default: shapepipe
LOG_NAME = log_sp

# Runner log file name, optional, default: shapepipe_runs
RUN_LOG_NAME = log_run_sp

# NUMBER_LIST selects this unit; the workflow sets SP_UNIT_NUM to the
# dashed tile ID (e.g. -210-282).
NUMBER_LIST = $SP_UNIT_NUM

# Input directory, containing input files, single string or list of names
INPUT_DIR = .

# Output directory.
#
# NODE-LOCAL, not $SP_RUN/output. This run produces the tile's ~5.6 GB vignette
# store, which is read only by ngmix and make_cat -- both of which run in the
# same fused group job on the same node (workflow/rules/tile.smk, TILE_GROUP).
# Writing it to the node's NVMe instead of NFS scratch is the whole point: it
# removes the store from the per-tile scratch high-water AND removes ~163 GB of
# small random NFS reads per tile.
#
# $SP_VIGNET_OUT is exported by every member of that group (TILE_LOCAL) as
# $SLURM_TMPDIR/sp-tile/output. Set it to $SP_RUN/output to keep the store on
# shared storage. It is NOT optional: ShapePipe's config expansion is strict
# (pipeline/config.py::_expandvars_strict), so an unset value is a loud error.
#
# The INPUT_DIRs below stay on $SP_RUN -- they are Sx / Mh_exp / Fe products on
# scratch, and every path here is absolute, so nothing resolves through a run
# log that this split would break.
OUTPUT_DIR = $SP_VIGNET_OUT


## ShapePipe job handling options
[JOB]

# Batch size of parallel processing (optional), default is 1, i.e. run all jobs in serial
SMP_BATCH_SIZE = 16

# Timeout value (optional), default is None, i.e. no timeout limit applied
TIMEOUT = 96:00:00


## Module options

[PSFEX_INTERP_RUNNER]

INPUT_DIR = $SP_RUN/output/run_sp_tile_Sx/sextractor_runner/output, $SP_RUN/output/run_sp_tile_Mh_exp/merge_headers_runner/output, $SP_RUN/output/run_sp_tile_Fe/find_exposures_runner/output

FILE_PATTERN = sexcat, log_exp_headers, exp_numbers

FILE_EXT = .fits, .sqlite, .txt

# NUMBERING_SCHEME (optional) string with numbering pattern for input files
NUMBERING_SCHEME = -000-000

# Run mode for psfex interpolation:
#  CLASSIC: 'classical' run, interpolate to object positions
#  MULTI-EPOCH: interpolate for multi-epoch images
#  VALIDATION: validation for single-epoch images
MODE = MULTI-EPOCH

# Column names of position parameters
POSITION_PARAMS = XWIN_WORLD,YWIN_WORLD

# If True, measure and store ellipticity of the PSF
GET_SHAPES = True

# Number of stars threshold
STAR_THRESH = 22

# chi^2 threshold
CHI2_THRESH = 2

# Multi-epoch mode parameters

# Root directory of per-exposure work directories.  psfex_runner/output/
# dirs are discovered by scanning $SP_EXP for the exposures listed in the
# exp_numbers input file.
ME_DOT_PSF_EXP_DIR = $SP_EXP

# Input psf file pattern
ME_DOT_PSF_PATTERN = star_split_ratio_80


# Create vignets for tiles weights
[VIGNETMAKER_RUNNER_RUN_1]

INPUT_DIR = $SP_RUN/output/run_sp_tile_Sx/sextractor_runner/output, $SP_RUN/output/run_sp_tile_Uz/uncompress_fits_runner/output

FILE_PATTERN = sexcat, CFIS_weight

FILE_EXT = .fits, .fits

# NUMBERING_SCHEME (optional) string with numbering pattern for input files
NUMBERING_SCHEME = -000-000

MASKING = False
MASK_VALUE = 0

# Run mode for psfex interpolation:
#  CLASSIC: 'classical' run, interpolate to object positions
#  MULTI-EPOCH: interpolate for multi-epoch images
#  VALIDATION: validation for single-epoch images
MODE = CLASSIC

# Coordinate frame type, one in PIX (pixel frame), SPHE (spherical coordinates)
COORD = PIX
POSITION_PARAMS = XWIN_IMAGE,YWIN_IMAGE

# Vignet size in pixels
STAMP_SIZE = 51

# Output file name prefix, file name is <PREFIX>_vignet.fits
PREFIX = weight


[VIGNETMAKER_RUNNER_RUN_2]

# Create multi-epoch vignets for tiles corresponding to
# positions on single-exposures

INPUT_DIR = $SP_RUN/output/run_sp_tile_Sx/sextractor_runner/output, $SP_RUN/output/run_sp_tile_Mh_exp/merge_headers_runner/output, $SP_RUN/output/run_sp_tile_Fe/find_exposures_runner/output

FILE_PATTERN = sexcat, log_exp_headers, exp_numbers

FILE_EXT = .fits, .sqlite, .txt

# NUMBERING_SCHEME (optional) string with numbering pattern for input files
NUMBERING_SCHEME = -000-000

MASKING = False
MASK_VALUE = 0

# Run mode for psfex interpolation:
#  CLASSIC: 'classical' run, interpolate to object positions
#  MULTI-EPOCH: interpolate for multi-epoch images
#  VALIDATION: validation for single-epoch images
MODE = MULTI-EPOCH

# Coordinate frame type, one in PIX (pixel frame), SPHE (spherical coordinates)
COORD = SPHE
POSITION_PARAMS = XWIN_WORLD,YWIN_WORLD

# Vignet size in pixels
STAMP_SIZE = 51

# Output file name prefix, file name is <PREFIX_>vignet.fits
PREFIX =

# Additional parameters for path and file pattern corresponding to single-exposure
# run outputs.  Output dirs are discovered by scanning $SP_EXP for the
# exposures listed in the exp_numbers input file.
ME_IMAGE_EXP_DIR = $SP_EXP
ME_IMAGE_EXP_RUNNERS = split_exp_runner, split_exp_runner, split_exp_runner, sextractor_runner, sextractor_runner
ME_IMAGE_PATTERN = flag, image, weight, background, background_rms
