# Shear branch 1z2m of skills_2-blended (25 tiles), handed the simulation's true
# spatially varying PSFEx models (psf_model: fake + psfex_models) instead of fitting PSFEx.
machine: fir
input_type: image_sims
base_dir: /project/rrg-kyi/cdaley/unions/analyses/image-sims
run: 1z2m_skills_2-blended-truepsf
tile_list: /scratch/cdaley/imsim/sims/1z2m_skills_2-blended/tiles.txt
inputs:
  tiles: /scratch/cdaley/imsim/sims/1z2m_skills_2-blended/images/SP_tiles
  exposures: /scratch/cdaley/imsim/sims/1z2m_skills_2-blended/images/SP_exp
psf_model: fake
psfex_models: /scratch/cdaley/imsim/sims/skills_2-blended_shared/psfex
ngmix_chunks: 16
clean: true
clean_tiles: true
