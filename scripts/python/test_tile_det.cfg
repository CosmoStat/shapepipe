# test_tile_det.cfg
# Configuration for test_tile_det.py: define which quantities to compare,
# which flag filters to apply, and per-quantity column names and ranges.

[jobs]
# Detection job number (bit value passed to run_job_sp_canfar_v2.0.bash -j)
det_job = 256
# tile_det modes to run and compare for det_job (space-separated)
det_modes = sx uc
# Bit-coded sum of all prerequisite jobs to run before det_job
# 255 = 1+2+4+8+16+32+64+128 (download → uncompress → find-exp → get-exp →
#       split-exp → mask-exp → PSF → merge-headers)
prereq_jobs = 255

[comparison]
# Space-separated list of quantity section names (processed in order)
quantities = magnitude flux_radius n_epoch

# Space-separated list of filter conditions to apply
#   all   -- no flag cut
#   eq0   -- FLAGS == 0
#   le2   -- FLAGS <= 2
filters = all eq0 le2

[flags]
# Column name carrying SExtractor FLAGS in each mode's sexcat
col_sx = FLAGS
col_uc = FLAGS

[magnitude]
label     = Magnitude
col_sx    = MAG_AUTO
col_uc    = MAG_AUTO
range_min = 16.0
range_max = 27.0
bin_width = 0.5

[flux_radius]
label     = Flux radius (pixels)
col_sx    = FLUX_RADIUS
col_uc    = FLUX_RADIUS
range_min = 0.0
range_max = 10.0
bin_width = 0.2

[n_epoch]
label     = N_epoch
col_sx    = N_EPOCH
col_uc    = N_EPOCH
range_min = 0
range_max = 20
bin_width = 1
