id: baseline_run1
description: >-
  Run 1 of ShapePipe v2 as it ran, the pipeline behind run1-snap3 and the
  v2.0.0 catalogue: 22,901 DR6 tiles in 969 campaigns on Nibi and Fir,
  10-27 Oct 2026, from ten integration/smk-g17..g19 commits (61b6255f for
  11,767 tiles, then 7f68451e, aad8cbce, 5df1e79c, de2b00f5, a169b3dc,
  ab4c2934, 255d4392, ba0d7032, 84e842dd), each run on the image
  shapepipe-develop-240b37e4.sif with the run config blend_handling uberseg,
  defect_fill interpolate, defect_weighting fourfold_zero. The ten commits
  make the same choice on every decision here. They differ only in the
  N_EPOCH definition of the 237 smk-g17 tiles (rewritten afterwards to the
  PSF-validated count), the tile pairing guard (no tile lost) and older
  coverage-map fragments (rebuilt). The baseline differs from develop
  (universes/committed.yaml) in one decision: run 1 predates the
  per-detection defect columns (shape_measurement.defect_flagging, #973).
  Develop also writes per-branch metacal shape errors (#1003), a column
  change outside the record.
decisions:
  per_unit_completeness: exact_counts
  postage_stamp_size: px_51
  photometric_zeropoint: fixed_30_tiles_header_exposures
analyses:
  masking:
    decisions:
      pixel_mask_source: instrument_flags_only
      psf_star_mask_veto: instrument_flags_only
      sky_mask_application: catalogue_columns
      pointing_square: main_array_hull
      nexp_map_valid_psf_ccds: valid_psf_ccds
      defect_map_from_flags: count_flagged_pixels
  detection:
    decisions:
      tile_detection: unions_catalogue
      detection_threshold_policy: megapipe_tiles
      deblending_policy: megapipe_tiles
      background_model: auto_megapipe_tiles
      weight_map_usage: map_weight
      zero_weight_interpolation: interp_all
      spurious_detection_cleaning: clean_1
      blend_photometry_mask_type: correct
      saturation_level: header_saturate
      photometry_parameters: kron_25_35
      detection_source_mode: sx_nomask_single_image
      epoch_membership_ccd_bounds: trimmed_bounds_33_2080
  preparation:
    decisions:
      astrometric_solution_source: delivered_headers
      ccd_split_extent: all_40_hdus
      epoch_provenance_from_tile_history: history_parse
      object_position_columns: xwin_windowed
      stamp_positioning_and_padding: round_and_zero_pad
  star_selection_psf:
    decisions:
      star_selection_box: locus_scaled_box
      psf_train_validation_split: split_80_20_seeded
      psfex_candidate_vetting: builtin_defaults
      psf_modelling_software: psfex
      psf_model_complexity: pixel_basis_deg2_per_ccd
      psf_sampling: native
      psf_chromaticity: achromatic
      psf_rendering: centred_model_stamp
      psf_acceptance_thresholds: stars22_chi2_2
  shape_measurement:
    decisions:
      ngmix_seed_mode: position_seed
      galaxy_model: gauss
      fit_initialisation: prior_guess_t025_ntry5_2
      fit_priors: gpriorba04_flat
      metacal_scheme: five_types_step001_fitgauss
      centroid_source: wcs
      epoch_flux_rescaling: fscale
      psf_epoch_averaging: galaxy_weight_sum
      galaxy_pixel_weights: rms_vignet_weights
      psf_likelihood_noise: psf_noise_1em5
      megacam_ccd_flip: megapipe_flip
      defect_fill: interpolate
      defect_flagging: stamp_wide_only
      blend_handling: uberseg
      defect_weighting: fourfold_zero
      epoch_masked_fraction_cut: ten_percent
      central_defect_veto: fixed_radii
  catalogue_assembly:
    decisions:
      star_galaxy_classification: deferred_downstream
      tile_overlap_handling: no_dedup_in_pipeline
      failure_sentinels: sentinel_values
