name: CI

on:
  pull_request:
    branches:
     - main
     - master
     - develop
  push:
    branches:
     - develop

jobs:

  test-full:
    name: Full Test Suite
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [3.11]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libopenblas-dev gcc-9 g++-9

      - name: Install macOS Dependencies
        shell: bash -l {0}
        if: runner.os == 'macOS'
        run: |
          brew tap sfarrens/sf
          brew install bigmac libomp
          brew reinstall gcc

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          auto-activate-base: true
          miniforge-version: latest

      - name: Install package (Linux)
        shell: bash -l {0}
        env:
          CC: gcc-9
          CXX: g++-9
        if: runner.os == 'Linux'
        run: ./install_shapepipe --develop

      - name: Install package (macOS)
        shell: bash -l {0}
        if: runner.os == 'macOS'
        run: ./install_shapepipe --develop

      - name: Run tests
        shell: bash -l {0}
        run: |
          conda activate shapepipe-dev
          pytest
          shapepipe_run -c example/config.ini
