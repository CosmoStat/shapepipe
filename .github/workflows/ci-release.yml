name: CI

on:
  pull_request:
    branches:
     - main
     - master
     - develop
  push:
    branches:
     - develop

jobs:

  test-full:
    name: Full Test Suite
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: [3.11]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install libopenblas-dev gcc-9 g++-9

      - name: Install macOS Dependencies
        shell: bash -l {0}
        if: runner.os == 'macOS'
        run: |
          brew tap sfarrens/sf
          brew install bigmac libomp
          brew reinstall gcc

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          auto-activate-base: true
          miniforge-version: latest

      - name: Install package (Linux)
        shell: bash -l {0}
        env:
          CC: gcc-9
          CXX: g++-9
        if: runner.os == 'Linux'
        run: ./install_shapepipe --develop

      - name: Install package (macOS)
        shell: bash -l {0}
        if: runner.os == 'macOS'
        run: ./install_shapepipe --develop

      - name: Run tests
        shell: bash -l {0}
        run: |
          conda activate shapepipe-dev
          pytest
          shapepipe_run -c example/config.ini
